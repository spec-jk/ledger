<!doctype html>
<html lang="ko">
<!-- LEDGER 앱버전 — node build-pwa.js로 만든 파일 1.0.0+40d61c70 -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEDGER</title>
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LEDGER">
  <style>
/* 디자인 변수 (2-1) */
:root {
  --bg: #f6f7fb; --panel: #ffffff; --line: #e4e6ef; --text: #1f2330; --muted: #7a8196;
  --accent: #5b6cff; --accent-soft: #eef0ff;
  --income: #2f6fde; --income-soft: #e3edff; --expense: #e5484d; --expense-soft: #ffe8e8; --transfer: #7a8196;
  --warn: #e0a100; --warn-bg: #fff6d6; --over: #c33; --today: #5b6cff;
  --sidebar-w: 360px; --radius: 10px;
  font-family: "Pretendard", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;

  /* 분류·계좌 색 10가지 (2-4) */
  --c-red-bg: #ffe0e0; --c-red-strong: #ffb3b3; --c-red-text: #7a2b2b;
  --c-orange-bg: #ffe6cc; --c-orange-strong: #ffc58f; --c-orange-text: #6e3d0c;
  --c-yellow-bg: #fff4bf; --c-yellow-strong: #ffe27a; --c-yellow-text: #5c4a00;
  --c-green-bg: #dcf3df; --c-green-strong: #a5dcae; --c-green-text: #1f5428;
  --c-teal-bg: #d3f0f1; --c-teal-strong: #94d6d9; --c-teal-text: #145558;
  --c-blue-bg: #dce8ff; --c-blue-strong: #adc8ff; --c-blue-text: #1f3f80;
  --c-purple-bg: #ebe0ff; --c-purple-strong: #cbb5ff; --c-purple-text: #4a2a8a;
  --c-pink-bg: #ffdfef; --c-pink-strong: #ffb5d8; --c-pink-text: #7f1f50;
  --c-gray-bg: #e9ebf0; --c-gray-strong: #c5cad6; --c-gray-text: #3a3f4d;
  --c-lavender-bg: #f3efff; --c-lavender-strong: #ddd3fb; --c-lavender-text: #5b4b8a;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--text); font-size: 14px;
}
button, input, select, textarea { font: inherit; color: inherit; }

/* 금액 자리 맞춤과 색 (2-1) */
.num { font-variant-numeric: tabular-nums; }
.amt-income { color: var(--income); }
.amt-expense { color: var(--expense); }
.amt-transfer { color: var(--transfer); }

/* 버튼 (2-3) */
.text-btn, .primary-btn, .danger-btn {
  border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; line-height: 1.3;
}
.text-btn { background: #fff; border: 1px solid var(--line); }
.text-btn:hover { background: var(--bg); }
.primary-btn { background: var(--accent); color: #fff; font-weight: 700; border: 1px solid var(--accent); }
.primary-btn:hover { filter: brightness(1.06); }
.danger-btn { background: #fff; color: #c33; border: 1px solid #f1b5b5; }

/* 상단바 (2-2) */
.topbar {
  flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--line);
}
.brand { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: .02em; }
.spacer { flex: 1; }

.tabs { display: flex; gap: 2px; padding: 3px; background: #eceef3; border-radius: 999px; }
.tab {
  border: 0; background: transparent; padding: 5px 14px; border-radius: 999px;
  color: var(--muted); cursor: pointer;
}
.tab.active { background: #fff; color: var(--text); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.month-nav { display: flex; align-items: center; gap: 6px; }
.nav-btn { padding: 4px 10px; }
.month-label { font-weight: 700; min-width: 96px; text-align: center; }

.month-summary { color: var(--muted); white-space: nowrap; }
.month-summary b { font-weight: 600; }

.save-status { color: var(--muted); font-size: 13px; white-space: nowrap; }
.save-status.error { color: var(--over); font-weight: 700; }

/* 달력 탭 (4장) */
#view-calendar.active { display: flex; flex-direction: column; overflow: hidden; }
.cal-week-head { flex: none; display: grid; grid-template-columns: repeat(7, 1fr); background: #fff; border-bottom: 1px solid var(--line); }
.cal-week-head div { padding: 6px 8px; font-size: 12px; color: var(--muted); text-align: left; }
.cal-week-head .sun { color: #e5484d; }
.cal-week-head .sat { color: #3e63dd; }
.cal-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-cell {
  min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 2px;
  padding: 6px 8px; background: #fff; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  cursor: pointer; user-select: none;
}
.cal-cell:nth-child(7n) { border-right: 0; }
.cal-cell:hover { background: #fbfbfe; }
.cal-cell.other { background: #fafafc; }
.cal-cell.other .dnum, .cal-cell.other .cal-sum, .cal-cell.other .cal-emojis { opacity: .4; }
.cal-cell.selected { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.dnum {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 24px; padding: 0 4px; border-radius: 999px; font-size: 13px; font-weight: 600;
}
.cal-cell.sun .dnum { color: #e5484d; }
.cal-cell.sat .dnum { color: #3e63dd; }
.cal-cell.today .dnum { background: var(--today); color: #fff; }
.cal-sum { font-size: 12px; line-height: 1.35; font-variant-numeric: tabular-nums; }
.cal-sum div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-emojis { font-size: 14px; line-height: 1.2; white-space: nowrap; overflow: hidden; }
.cal-emojis .more { font-size: 11px; color: var(--muted); margin-left: 2px; }
/* 끌어서 옮기기 (14장) */
.cal-emo { cursor: grab; display: inline-block; border-radius: 4px; }
.cal-emo:hover { background: rgba(0,0,0,.06); }
.cal-emo.transfer { color: var(--transfer); font-weight: 700; font-size: 13px; padding: 0 2px; }
.tx-card[draggable="true"] { cursor: grab; }
.cal-cell.drop-over { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }

/* 목록 탭 (5장) */
#view-list.active { display: flex; flex-direction: column; overflow: hidden; }
.list-filters {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line);
}
.list-filters select, .list-filters input {
  padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
}
.list-filters .f-custom { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.list-filters .f-query { flex: 1; min-width: 180px; }
.list-total { flex: none; padding: 8px 16px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg); }
.list-total b { font-weight: 700; }
.list-scroll { flex: 1; min-height: 0; overflow: auto; }
.day-head {
  position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; gap: 12px;
  padding: 7px 16px; background: #f0f1f6; border-bottom: 1px solid var(--line);
  font-weight: 700; font-size: 13px;
}
.day-head .sums { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
.list-row {
  /* 열 너비가 내용과 무관해야 줄마다 열이 맞음 */
  display: grid; grid-template-columns: minmax(0, 140px) minmax(60px, 1fr) minmax(0, 180px) 130px; align-items: center; gap: 12px;
  padding: 9px 16px; background: #fff; border-bottom: 1px solid var(--line); cursor: pointer;
}
.list-row:hover { background: #fbfbfe; }
.list-row.auto { cursor: default; color: var(--transfer); background: #fafafc; }
.list-row.auto .name { color: var(--transfer); }
.tx-card.auto { cursor: default; }
.tx-card.auto:hover { border-color: transparent; }
.list-row .cat { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.list-row .cat .emoji {
  flex: none; width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center;
}
.list-row .cat .name { overflow: hidden; text-overflow: ellipsis; }
.list-row .memo, .list-row .acct { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .acct { color: var(--muted); font-size: 13px; }
.list-row .amt { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.list-row .tag { color: var(--muted); font-size: 12px; margin-left: 4px; }
.list-empty { padding: 24px 16px; color: var(--muted); }

/* 통계 탭 (11장) */
#view-stats.active { display: flex; flex-direction: column; overflow: hidden; }
.stats-scroll { flex: 1; min-height: 0; overflow: auto; padding: 16px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.donut-wrap svg { max-width: 220px; }
.stat-card .donut-wrap { grid-template-columns: minmax(160px, 220px) 1fr; }
.stat-card:not(.wide) svg { max-height: 220px; }
.stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.stat-card.wide { grid-column: 1 / -1; }
.stat-card h3 { margin: 0 0 10px; font-size: 14px; }
.stat-card h3 .sub { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.stat-card svg { display: block; width: 100%; height: auto; }
.donut-wrap { display: grid; grid-template-columns: 180px 1fr; gap: 16px; align-items: start; }
.stat-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.stat-table th { text-align: right; font-weight: 400; color: var(--muted); font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.stat-table th:first-child, .stat-table td:first-child { text-align: left; }
.stat-table td { text-align: right; padding: 5px 6px; border-bottom: 1px solid #f0f1f5; white-space: nowrap; }
.stat-table .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.up { color: var(--expense); }
.down { color: var(--income); }
/* 열 너비를 고정해야 줄마다 막대 길이 기준이 같음 */
.hbar-row { display: grid; grid-template-columns: 90px minmax(60px, 1fr) 200px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
.hbar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar { height: 14px; border-radius: 4px; background: #f0f1f5; overflow: hidden; }
.hbar span { display: block; height: 100%; border-radius: 4px; }
.hbar-row .val { font-variant-numeric: tabular-nums; text-align: right; }
.hbar-row .val small { color: var(--muted); margin-left: 4px; }
.stat-empty { color: var(--muted); padding: 20px 0; text-align: center; }
.stat-big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
.stat-big small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.chart-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.stat-tip {
  position: fixed; z-index: 60; pointer-events: none; padding: 6px 10px; border-radius: 6px;
  background: var(--text); color: #fff; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
[data-tip] { cursor: default; }
@media (max-width: 520px) { .donut-wrap { grid-template-columns: 1fr; } .stats-grid { grid-template-columns: 1fr; } }

/* 사이드바 (6장) */
.sidebar {
  flex: none; position: relative; width: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column;
  background: var(--panel); border-left: 1px solid var(--line);
}
.sidebar.floating {
  position: fixed; z-index: 40; border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 10px 32px rgba(0,0,0,.16); overflow: hidden;
}
.side-resize { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; cursor: ew-resize; z-index: 2; }
.sidebar.floating .side-resize { left: 0; }
.side-head {
  flex: none; display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.sidebar.floating .side-head { cursor: move; }
.side-title { flex: 1; min-width: 0; }
.side-title-main { font-size: 15px; font-weight: 700; }
.side-title-sub { margin-top: 2px; font-size: 12px; color: var(--muted); }
.side-float-btn { padding: 2px 8px; font-size: 14px; }
.side-body { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.side-foot { flex: none; padding: 10px 12px; border-top: 1px solid var(--line); }
.side-foot:empty { display: none; }
.side-empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
.side-add { width: 100%; }

.tx-card {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid transparent;
}
.tx-card:hover { border-color: rgba(0,0,0,.08); }
.tx-card .emoji { font-size: 20px; flex: none; width: 24px; text-align: center; }
.tx-card .info { flex: 1; min-width: 0; }
.tx-card .cat { font-weight: 600; font-size: 13px; }
.tx-card .meta { font-size: 12px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-card .amt { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }

.acct-row {
  display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; cursor: pointer; text-align: left; width: 100%;
}
.acct-row:hover { background: var(--bg); }
.acct-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
.acct-row .info { flex: 1; min-width: 0; }
.acct-row .name { font-weight: 600; }
.acct-row .kind { font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 400; }
.acct-row .meta { font-size: 12px; color: var(--muted); }
.acct-row .bal { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
.acct-row .bal.neg { color: var(--expense); }
.net-worth { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }

/* 거래 입력창 (7장) */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50; background: rgba(31, 35, 48, .28);
}
.modal-backdrop[hidden] { display: none; }
.modal {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 440px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px);
  display: flex; flex-direction: column;
  background: var(--panel); border-radius: var(--radius); box-shadow: 0 12px 40px rgba(0,0,0,.2);
}
.modal-head {
  padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: move; user-select: none;
}
.modal-head h2 { margin: 0; font-size: 16px; }
.modal-body { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }

.type-tabs { display: flex; gap: 2px; padding: 3px; background: #eceef3; border-radius: 999px; }
.type-tab, .set-tab { flex: 1; border: 0; background: transparent; padding: 6px 0; border-radius: 999px; color: var(--muted); cursor: pointer; }
.type-tab.active, .set-tab.active { background: #fff; color: var(--text); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.type-tab.active[data-type="expense"] { color: var(--expense); }
.type-tab.active[data-type="income"] { color: var(--income); }
.type-tab.active[data-type="transfer"] { color: var(--transfer); }

.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 12px; color: var(--muted); }
/* 칸 이름 + 오른쪽 '+ 추가' */
.field-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; cursor: pointer; }
.link-btn:hover { text-decoration: underline; }
/* 거래 입력창에서 연 '+ 추가' 작은 창: 입력 칸만 */
.settings-modal.quick { width: 440px; }
.settings-modal.quick .set-tabs, .settings-modal.quick #layoutReset, .settings-modal.quick .set-list,
.settings-modal.quick .set-add, .settings-modal.quick .cat-group, .settings-modal.quick .set-editor-title,
.settings-modal.quick .modal-foot { display: none; }
.settings-modal.quick .set-editor { border: 0; padding: 0; background: transparent; }
.field input[type="text"], .field input[type="date"], .field select {
  width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
}
.field input:focus, .field select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

.amount-wrap { position: relative; display: block; }
/* '원' 글자 자리를 비워 숫자가 원 앞에서 끝나게 (.field input[type="text"]보다 우선) */
.field input.amount-input[type="text"] { font-size: 20px; font-weight: 700; text-align: right; padding-right: 38px; }
.amount-unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }

.cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.cat-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px;
  border: 2px solid transparent; border-radius: 8px; cursor: pointer; font-size: 12px; line-height: 1.2;
}
.cat-btn .emoji { font-size: 20px; }
.cat-btn.selected { font-weight: 700; }

.transfer-pick { display: flex; align-items: center; gap: 8px; }
.transfer-pick select { flex: 1; min-width: 0; }
.transfer-pick .arrow { color: var(--muted); }

/* 반복·할부 (10장) */
.weekday-pick { display: flex; gap: 4px; }
.weekday-btn {
  width: 34px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer;
}
.weekday-btn.sun { color: #e5484d; }
.weekday-btn.sat { color: #3e63dd; }
.weekday-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
#txRepeatRow select:disabled, #txInstallRow select:disabled { background: var(--bg); color: var(--muted); }
.scope-modal { width: 320px; }
.scope-modal .modal-body { gap: 8px; }
.scope-btn { width: 100%; padding: 10px 12px; text-align: left; }

.form-error { margin: 0; min-height: 1.3em; color: var(--over); font-size: 13px; }

/* 예산 (8장) */
.side-budget { flex: none; padding: 10px 14px; border-bottom: 1px solid var(--line); background: #fff; }
.side-budget:empty { display: none; }
.b-main { cursor: pointer; user-select: none; }
.b-row { display: flex; flex-direction: column; gap: 4px; }
.b-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.b-top .label { font-weight: 700; white-space: nowrap; }
.b-main .b-top .label { font-size: 13px; }
.b-top .nums { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.b-bar { height: 6px; border-radius: 999px; background: #eceef3; overflow: hidden; }
.b-bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.b-bar span.warn { background: var(--warn); }
.b-bar span.over { background: var(--over); }
.over-text { color: var(--over); font-weight: 700; }
.b-detail { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 40vh; overflow: auto; }
.b-section { font-size: 11px; color: var(--muted); margin-top: 2px; }
.b-grid { display: grid; grid-template-columns: 1fr 160px; gap: 6px 10px; align-items: center; }
.b-grid .amount-wrap input { width: 100%; padding: 6px 30px 6px 8px; border: 1px solid var(--line); border-radius: 6px; text-align: right; background: #fff; }
.b-grid .amount-unit { right: 10px; }
.b-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.b-controls select, .b-controls input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.toast { white-space: pre-line; }

/* CSV 가져오기 (12장) */
.csv-modal { width: min(1000px, calc(100vw - 32px)); }
.csv-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.csv-map label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; min-width: 0; }
.csv-map .col-name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.csv-map select, .csv-bulk select, .csv-table select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; max-width: 100%; }
.csv-bulk { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 10px 0 6px; font-size: 13px; }
.csv-scroll { max-height: 42vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.csv-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.csv-table th { position: sticky; top: 0; background: #f0f1f6; text-align: left; padding: 6px; font-weight: 600; white-space: nowrap; }
.csv-table td { padding: 4px 6px; border-top: 1px solid #f0f1f5; white-space: nowrap; }
.csv-table td.memo { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.csv-table td.amt { text-align: right; font-variant-numeric: tabular-nums; }
.csv-table tr.off td { opacity: .5; }
.csv-table .st-dup { color: var(--warn); font-weight: 600; }
.csv-table .st-bad { color: var(--over); font-weight: 600; }

/* 가족 사용자 (18장) */
.member-sel { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.member-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.member-chip { border: 2px solid transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.member-chip.selected { font-weight: 700; }
.who {
  display: inline-block; padding: 0 6px; margin-right: 5px; border-radius: 999px;
  font-size: 11px; font-weight: 600; line-height: 18px; vertical-align: 1px;
}

/* 설정 */
.settings-modal { width: 540px; }
.set-tabs { margin: 12px 16px 0; }
.set-list { display: flex; flex-direction: column; gap: 6px; }
.set-row {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; text-align: left;
  background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
}
.set-row:hover { background: var(--bg); }
.set-row.editing { border-color: var(--accent); background: var(--accent-soft); }
.set-row .name { flex: 1; min-width: 0; font-weight: 600; }
.set-row .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.set-add { align-self: flex-start; }
.cat-row { padding: 4px 6px 4px 4px; gap: 4px; cursor: default; }
.cat-row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 4px 6px; border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: 6px; }
.cat-row-main:hover { background: var(--bg); }
.cat-chip { flex: none; width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
.order-btn { padding: 2px 8px; font-size: 11px; }
.order-btn:disabled { opacity: .35; cursor: default; }
.set-editor {
  display: flex; flex-direction: column; gap: 10px; padding: 12px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg);
}
.set-editor-title { font-weight: 700; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.swatch.selected { box-shadow: 0 0 0 2px var(--text); }
.check-line { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.member-checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.hint { font-size: 12px; color: var(--muted); }
.card-fields { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; }
.field input.opening-input[type="text"] { text-align: right; padding-right: 32px; }
.editor-btns { display: flex; align-items: center; gap: 8px; }

/* 알림 */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  max-width: min(560px, calc(100vw - 32px)); padding: 10px 16px; border-radius: var(--radius);
  background: var(--text); color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.18);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 금액 가리기 스위치 */
.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch-track {
  width: 34px; height: 20px; border-radius: 999px; background: #d4d7e2; position: relative; transition: background .15s;
}
.switch-knob {
  position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s;
}
.switch input:checked + .switch-track { background: var(--accent); }
.switch input:checked + .switch-track .switch-knob { left: 16px; }
.switch input:focus-visible + .switch-track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 본문: 스크롤은 각 패널 안에서 */
.main { flex: 1; min-height: 0; display: flex; }
.view { display: none; flex: 1; min-width: 0; overflow: auto; }
.view.active { display: flex; flex-direction: column; }

/* 휴대폰 배치 (20장): 폭 768px 이하 — 달력이 화면 전체, 사이드바는 아래에서 올라오는 창 */
.side-close { display: none; padding: 2px 8px; font-size: 14px; }
.sheet-backdrop { display: none; }
@media (max-width: 768px) {
  .topbar { padding: 8px 12px; gap: 6px 8px; }
  .brand { font-size: 16px; order: 1; }
  .tabs { order: 2; }
  .tab { padding: 4px 10px; }
  #settingsBtn { order: 3; margin-left: auto; }
  .month-nav { order: 4; gap: 4px; }
  .month-label { min-width: 84px; }
  .member-sel { order: 5; }
  .month-summary { order: 6; font-size: 12px; }
  .save-status { order: 7; font-size: 12px; margin-left: auto; }
  .save-status .ss-word { display: none; }
  #accountsBtn { order: 8; }
  .switch { order: 9; font-size: 13px; }
  #addTx { order: 10; margin-left: auto; }
  .topbar .spacer { display: none; }
  .text-btn, .primary-btn { padding: 5px 10px; }

  /* 좁은 달력 칸: 여백과 글자를 줄여 금액이 더 보이게 */
  .cal-cell { padding: 4px 3px; }
  .dnum { min-width: 22px; height: 22px; font-size: 12px; }
  .cal-sum { font-size: 10px; letter-spacing: -.02em; }
  .cal-emojis { font-size: 12px; }
  .cal-emo.transfer { font-size: 11px; }

  /* 목록: 한 줄 4칸 → 두 줄 (분류 · 금액 / 메모 · 결제수단) */
  .list-row {
    grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "cat amt" "memo acct";
    gap: 2px 10px; padding: 8px 12px;
  }
  .list-row .cat { grid-area: cat; }
  .list-row .amt { grid-area: amt; }
  .list-row .memo { grid-area: memo; font-size: 13px; color: var(--muted); padding-left: 34px; }
  .list-row .acct { grid-area: acct; text-align: right; font-size: 12px; }

  .sidebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; width: auto;
    height: 70vh; height: 70dvh;
    border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    box-shadow: 0 -8px 28px rgba(0,0,0,.18); overflow: hidden;
    transform: translateY(105%); visibility: hidden; transition: transform .22s ease, visibility .22s;
  }
  body.sheet-open .sidebar { transform: none; visibility: visible; }
  body.sheet-open .sheet-backdrop { display: block; position: fixed; inset: 0; z-index: 44; background: rgba(31, 35, 48, .28); }
  .side-resize, .side-float-btn { display: none; }
  .side-close { display: inline-block; }
}


/* 구글 서버판: 가족 암호 창 */
.gas-auth { z-index: 1000; }
.gas-auth-modal { width: 360px; }
.gas-auth-modal .hint { margin: 0; }
</style>
</head>
<body>
  <!-- 상단바 (2-2) -->
  <header class="topbar">
    <h1 class="brand">LEDGER</h1>

    <nav class="tabs" role="tablist">

      <button class="tab" role="tab" data-tab="list">목록</button>
      <button class="tab" role="tab" data-tab="stats">통계</button>

    <div class="month-nav">
      <button class="text-btn nav-btn" id="prevMonth" title="지난달">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="text-btn nav-btn" id="nextMonth" title="다음 달">›</button>
      <button class="text-btn" id="thisMonth">이번 달</button>
    </div>

    <select class="member-sel" id="memberSel" aria-label="사용자"></select>

    <div class="month-summary num" id="monthSummary"></div>

    <div class="spacer"></div>

    <span class="save-status" id="saveStatus"></span>
    <button class="primary-btn" id="addTx">+ 거래 추가</button>
    <button class="text-btn" id="accountsBtn">계좌·카드 ▸</button>
    <label class="switch">
      <input type="checkbox" id="hideToggle">
      <span class="switch-track"><span class="switch-knob"></span></span>
      <span>금액 가리기</span>
    </label>
    <button class="text-btn" id="settingsBtn">⚙ 설정</button>
  </header>

  <!-- 탭 화면 + 오른쪽 사이드바 -->
  <main class="main">
    <section class="view active" id="view-calendar">
      <div class="cal-week-head" id="calWeekHead"></div>
      <div class="cal-grid" id="calGrid"></div>
    </section>
    <!-- 목록 탭 (5장) -->
    <section class="view" id="view-list">
      <div class="list-filters">
        <select id="fPeriod" aria-label="기간">
          <option value="this">이번 달</option>
          <option value="last">지난달</option>
          <option value="custom">직접 선택</option>
        </select>
        <span class="f-custom" id="fCustom" hidden>
          <input type="date" id="fFrom" aria-label="시작 날짜"> ~ <input type="date" id="fTo" aria-label="끝 날짜">
        </span>
        <select id="fType" aria-label="종류">
          <option value="all">전체</option>
          <option value="expense">지출</option>
          <option value="income">수입</option>
          <option value="transfer">이체</option>
        </select>
        <select id="fCategory" aria-label="분류"></select>
        <select id="fAccount" aria-label="결제수단"></select>
        <select id="fMember" aria-label="사용자"></select>
        <input type="search" id="fQuery" class="f-query" placeholder="검색 (메모·장소·분류, >50000)" aria-label="검색어">
        <button type="button" class="text-btn" id="csvExport">⤓ CSV 내보내기</button>
        <button type="button" class="text-btn" id="csvImport">⤒ CSV 가져오기</button>
      </div>
      <div class="list-total num" id="listTotal"></div>
      <div class="list-scroll" id="listScroll"></div>
    </section>
    <!-- 통계 탭 (11장) -->
    <section class="view" id="view-stats">
      <div class="list-filters">
        <select id="sPeriod" aria-label="통계 기간">
          <option value="this">이번 달</option>
          <option value="last">지난달</option>
          <option value="3">최근 3개월</option>
          <option value="6">최근 6개월</option>
          <option value="12">최근 12개월</option>
          <option value="custom">직접 선택</option>
        </select>
        <span class="f-custom" id="sCustom" hidden>
          <input type="date" id="sFrom" aria-label="시작 날짜"> ~ <input type="date" id="sTo" aria-label="끝 날짜">
        </span>
        <span class="hint" id="sRangeLabel"></span>
      </div>
      <div class="stats-scroll">
        <div class="stats-grid" id="statsGrid"></div>
      </div>
      <div class="stat-tip" id="statTip" hidden></div>
    </section>

    <!-- 사이드바 (6장) -->
    <aside class="sidebar" id="sidebar">
      <div class="side-resize" id="sideResize" title="너비 조절"></div>
      <div class="side-budget" id="sideBudget"></div>
      <div class="side-head" id="sideHead">
        <div class="side-title">
          <div class="side-title-main" id="sideTitle"></div>
          <div class="side-title-sub num" id="sideSub"></div>
        </div>
        <button type="button" class="text-btn side-float-btn" id="sideFloat"></button>
        <button type="button" class="text-btn side-close" id="sideClose" title="닫기" aria-label="닫기">✕</button>
      </div>
      <div class="side-body" id="sideBody"></div>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <!-- 휴대폰 배치: 아래 창 뒤 어두운 바탕 (20장) -->
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
  </main>

  <!-- 거래 입력창 (7장) -->
  <div class="modal-backdrop" id="txModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="txTitle">
      <div class="modal-head" id="txHead">
        <h2 id="txTitle">거래 추가</h2>
      </div>
      <div class="modal-body">
        <div class="type-tabs" role="tablist">
          <button type="button" class="type-tab" data-type="expense">지출</button>
          <button type="button" class="type-tab" data-type="income">수입</button>
          <button type="button" class="type-tab" data-type="transfer">이체</button>
        </div>

        <label class="field">
          <span class="field-label">금액</span>
          <span class="amount-wrap">
            <input type="text" id="txAmount" class="amount-input num" inputmode="numeric" autocomplete="off" placeholder="0">
            <span class="amount-unit">원</span>
          </span>
        </label>

        <label class="field">
          <span class="field-label">날짜</span>
          <input type="date" id="txDate">
        </label>

        <div class="field" id="txCategoryRow">
          <div class="field-head"><span class="field-label">분류</span><button type="button" class="link-btn" id="qaCategory">+ 분류 추가</button></div>
          <div class="cat-grid" id="txCategories"></div>
        </div>

        <div class="field">
          <div class="field-head"><span class="field-label">사용자</span><button type="button" class="link-btn" id="qaMember">+ 사용자 추가</button></div>
          <div class="member-pick" id="txMembers"></div>
        </div>

        <div class="field" id="txAccountRow">
          <div class="field-head"><span class="field-label">결제수단</span><button type="button" class="link-btn" id="qaAccount">+ 결제수단 추가</button></div>

          <div class="transfer-pick">
            <select id="txFrom" aria-label="보내는 계좌"></select>
            <span class="arrow">→</span>
            <select id="txTo" aria-label="받는 계좌"></select>
          </div>
        </div>

        <label class="field">
          <span class="field-label">메모</span>
          <input type="text" id="txMemo" maxlength="40" autocomplete="off">
        </label>

        <label class="field">
          <span class="field-label">장소</span>
          <input type="text" id="txPlace" maxlength="40" autocomplete="off" placeholder="선택">
        </label>

        <!-- 반복 (10장) -->
        <div class="field" id="txRepeatRow">
          <span class="field-label">반복</span>
          <select id="txRepeat">
            <option value="none">반복 안 함</option>
            <option value="daily">매일</option>
            <option value="weekdays">평일</option>
            <option value="weekly">매주</option>
            <option value="biweekly">2주마다</option>
            <option value="monthly">매월</option>
            <option value="yearly">매년</option>
          </select>
          <div class="weekday-pick" id="txDays" hidden></div>

            <input type="date" id="txUntil">

          <span class="field-label">할부</span>

        <p class="form-error" id="txError" role="alert"></p>

      <div class="modal-foot">
        <button type="button" class="danger-btn" id="txDelete">삭제</button>
        <div class="spacer"></div>
        <button type="button" class="text-btn" id="txCancel">취소</button>
        <button type="button" class="primary-btn" id="txSave">저장</button>
      </div>
    </div>
  </div>

  <!-- CSV 가져오기 (12장) -->
  <div class="modal-backdrop" id="csvModal" hidden>
    <div class="modal csv-modal" role="dialog" aria-modal="true" aria-labelledby="csvTitle">
      <div class="modal-head"><h2 id="csvTitle">CSV 가져오기</h2></div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">파일 (LEDGER에서 내보낸 CSV, 또는 은행·카드사 엑셀을 CSV로 저장한 파일)</span>

        <div class="spacer"></div>

        <button type="button" class="primary-btn" id="csvAdd" disabled>추가</button>

  </div>

  <!-- 반복·할부 수정·삭제 범위 고르기 (10장) -->
  <div class="modal-backdrop" id="scopeModal" hidden>
    <div class="modal scope-modal" role="dialog" aria-modal="true" aria-labelledby="scopeTitle">
      <div class="modal-head"><h2 id="scopeTitle"></h2></div>
      <div class="modal-body" id="scopeBody"></div>
      <div class="modal-foot">
        <div class="spacer"></div>
        <button type="button" class="text-btn" id="scopeCancel">취소</button>
      </div>
    </div>

  <!-- 설정 (14장 일부 · 18장) -->
  <div class="modal-backdrop" id="setModal" hidden>
    <div class="modal settings-modal" role="dialog" aria-modal="true" aria-labelledby="setTitle">
      <div class="modal-head">
        <h2 id="setTitle">⚙ 설정</h2>
      </div>
      <div class="type-tabs set-tabs" role="tablist">
        <button type="button" class="set-tab" data-set="categories">분류</button>
        <button type="button" class="set-tab" data-set="accounts">계좌·카드</button>
        <button type="button" class="set-tab" data-set="budget">예산</button>
        <button type="button" class="set-tab" data-set="members">가족 구성원</button>
      </div>
      <div class="modal-body" id="setBody"></div>
      <div class="modal-foot">
        <button type="button" class="text-btn" id="layoutReset" title="사이드바 너비·띄우기를 처음 상태로">배치 초기화</button>
        <div class="spacer"></div>
        <button type="button" class="text-btn" id="setClose">닫기</button>
      </div>
    </div>
  </div>

  <!-- 알림 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
// ===== 구글버전: 서버 대신 google.script.run → 대표자 드라이브 =====
// app.js보다 먼저 실행. app.js의 /api/... 요청을 Code.gs의 api()로 돌려 준다.
(function () {
  'use strict';
  const PW_KEY = 'ledger-edu.gas.pw';
  const store = {
    get() { try { return localStorage.getItem(PW_KEY); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(PW_KEY, v); } catch (e) {} },
    clear() { try { localStorage.removeItem(PW_KEY); } catch (e) {} },
  };
  let password = store.get();

  const EDITION = 'app';
  // 앱버전: GitHub Pages에 올린 화면에서 구글 웹앱 주소(/exec)로 바로 보냄
  // - 내용 형식을 text/plain으로 두고 머리글을 더하지 않아야 브라우저가 사전 확인(OPTIONS) 없이 보냄
  // - 구글은 googleusercontent.com으로 넘겨 주며 결과를 돌려줌(redirect 따라감)
  const API_URL = "https://script.google.com/macros/s/AKfycby3ka-346ePYQHtdXTTJV5yKQa06_eLm6zwvoLEEUXZQQ8kOY3VwG8sZukB-FPxYEFMmw/exec";
  async function run(req) {
    if (!API_URL) throw new Error('앱에 구글 웹앱 주소가 아직 들어 있지 않습니다. 대표자에게 알려 주세요.');
    const r = await realFetch(API_URL, {
      method: 'POST', redirect: 'follow', cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(req),
    });
    if (!r.ok) throw new Error('구글 서버 응답 ' + r.status);
    try { return await r.json(); } catch (e) { throw new Error('구글 서버 응답을 읽지 못했습니다. 웹앱 배포 설정(모든 사용자)을 확인해 주세요.'); }
  }

  // ---------- 가족 암호 창 ----------
  const box = document.createElement('div');
  box.className = 'modal-backdrop gas-auth';
  box.id = 'gasAuth';
  box.hidden = true;
  box.innerHTML =
    '<form class="modal gas-auth-modal" role="dialog" aria-modal="true" aria-labelledby="gasAuthTitle">' +
    '<div class="modal-head"><h2 id="gasAuthTitle">💰 LEDGER</h2></div>' +
    '<div class="modal-body">' +
    '<label class="field"><span class="field-label">가족 암호</span>' +
    '<input type="password" id="gasPw" autocomplete="current-password" required></label>' +
    '<p class="hint">대표자에게 받은 암호를 넣으세요. 이 브라우저가 기억합니다.</p>' +
    '<p class="form-error" id="gasPwError" role="alert"></p>' +
    '</div>' +
    '<div class="modal-foot"><div class="spacer"></div><button type="submit" class="primary-btn" id="gasPwOk">들어가기</button></div>' +
    '</form>';
  document.body.appendChild(box);
  const input = box.querySelector('#gasPw');
  const err = box.querySelector('#gasPwError');
  const ok = box.querySelector('#gasPwOk');

  let asking = null; // 창이 떠 있는 동안 기다리는 Promise (여러 요청이 같이 기다림)
  function askPassword(message) {
    err.textContent = message || '';
    if (asking) return asking;
    asking = new Promise((resolve) => {
      box.hidden = false;
      input.value = '';
      setTimeout(() => input.focus(), 0);
      box.querySelector('form').onsubmit = async (e) => {
        e.preventDefault();
        const v = input.value;
        if (!v) return;
        ok.disabled = true;
        err.textContent = '확인하는 중…';
        try {
          const r = await run({ path: '/api/auth', password: v });
          if (r.status === 200) {
            password = v; store.set(v);
            box.hidden = true; asking = null; resolve();
          } else err.textContent = (r.body && r.body.error) || '암호가 맞지 않습니다.';
        } catch (x) {
          err.textContent = '구글 서버에 연결하지 못했습니다. (' + (x && x.message || x) + ')';
        } finally { ok.disabled = false; }
      };
    });
    return asking;
  }

  // 암호가 필요하면 창을 띄우고, 맞으면 같은 요청을 다시
  async function call(req) {
    for (;;) {
      if (!password) await askPassword('');
      const r = await run(Object.assign({}, req, { password: password }));
      if (r.status !== 401 && r.status !== 429) return r;
      const remembered = !!password;
      // 429(여러 번 틀려 막힘)는 다른 사람 때문일 수 있으니 기억한 암호는 지우지 않음
      if (r.status === 401) { password = null; store.clear(); }
      // 기억해 둔 암호가 안 맞으면 대표자가 암호를 바꾼 것
      const msg = r.status === 401 && remembered ? '가족 암호가 바뀌었습니다. 대표자에게 받은 새 암호를 넣어 주세요.' : (r.body && r.body.error) || '';
      await askPassword(msg);
    }
  }

  const json = (status, obj, headers) => new Response(obj == null ? null : JSON.stringify(obj),
    { status: status, headers: Object.assign({ 'Content-Type': 'application/json' }, headers || {}) });
  const realFetch = window.fetch.bind(window);
  window.fetch = async function (input, init) {
    init = init || {};
    const url = typeof input === 'string' ? input : input.url;
    if (!url.startsWith('/api/')) return realFetch(input, init);
    const method = (init.method || 'GET').toUpperCase();
    const headers = new Headers(init.headers || {});
    if (url.startsWith('/api/ping')) return json(200, { app: 'ledger-edu', edition: EDITION, appMode: false });
    if (url !== '/api/data') return json(404, { error: '구글버전에서는 쓰지 않는 기능입니다.' });
    let r;
    try {
      r = await call({
        method: method, path: url,
        ifMatch: headers.get('If-Match') || '', ifNoneMatch: headers.get('If-None-Match') || '',
        body: method === 'PUT' ? init.body : undefined,
      });
    } catch (x) {
      // 인터넷이 끊겼거나 구글 로그인이 풀림 → app.js가 다음 확인 때 다시 시도
      return json(503, { error: '구글 서버에 연결하지 못했습니다.' });
    }
    const h = r.rev ? { 'X-Revision': r.rev } : {};
    if (r.status === 304) return new Response(null, { status: 304, headers: h });
    if (r.text != null) return new Response(r.text, { status: r.status, headers: Object.assign({ 'Content-Type': 'application/json' }, h) });
    return json(r.status, r.body || {}, h);
  };
  // 구글버전에서는 창 닫기 알림이 필요 없음
  try { navigator.sendBeacon = () => true; } catch (e) {}
})();

</script>
<script>
// LEDGER 화면 — 상단바, 자료 불러오기·저장·합치기·5초 판 확인
'use strict';

const today = new Date();

// 화면 전체가 함께 쓰는 상태 (1장 2번: 모든 화면이 state.data 하나를 공유)
const state = {
  data: null,      // 지금 화면 자료
  base: null,      // 서버에서 마지막으로 받은(또는 저장한) 자료 — 합치기 기준
  rev: null,       // 서버 판(X-Revision)
  dirty: false,    // 저장 안 된 변경이 있음
  saving: false,
  locked: false,   // 불러오기 실패 → 편집 잠금
  savedAt: null,
  modalOpen: false, // 입력창이 열린 동안은 판 확인을 쉼
  selectedDate: null,    // 달력에서 고른 날짜
  sidePanel: 'accounts', // 사이드바: 'day'(그날 거래) / 'accounts'(계좌·카드)
  member: '',            // 상단바 사용자: ''=전체, '_shared'=공동, 그 밖엔 사용자 id (18장)
  budgetOpen: false,     // 사이드바 예산 막대 펼침
  // 금액 가리기 (14장): 켜짐을 localStorage ledger-edu.hide에 기억
  hideAmounts: (() => { try { return localStorage.getItem('ledger-edu.hide') === '1'; } catch { return false; } })(),
  // 목록 탭 거르기 (기간 this/last는 상단바의 달 기준)
  list: { period: 'this', from: '', to: '', type: 'all', category: '', account: '', q: '' },
  tab: 'calendar',
  year: today.getFullYear(),
  month: today.getMonth() + 1, // 1~12
};

const $ = (sel) => document.querySelector(sel);
const clone = (o) => JSON.parse(JSON.stringify(o));
const pad = (n) => String(n).padStart(2, '0');

// id = Date.now().toString(36) + 난수 5자리 (3장)
function makeId() {
  let r = '';
  while (r.length < 5) r += Math.random().toString(36).slice(2);
  return Date.now().toString(36) + r.slice(0, 5);
}

// 1234000 → "1,234,000"
// 화면에 보이는 금액: 금액 가리기(14장)가 켜져 있으면 •••••
function fmt(n) { return state.hideAmounts ? '•••••' : Math.abs(n).toLocaleString('ko-KR'); }
// 입력 칸에 넣는 금액 (가리기와 상관없이 숫자)
function fmtNum(n) { return Math.abs(n).toLocaleString('ko-KR'); }
function signed(n, sign) { return sign + fmt(n); }
function monthKey(y, m) { return `${y}-${pad(m)}`; }

// 같은 날 정렬: 수입 → 지출 → 이체, 그 안에서 입력 순 (3장)
const TYPE_ORDER = { income: 0, expense: 1, transfer: 2, cardpay: 3 }; // cardpay = 카드대금 자동 줄
function sortTransactions(list) {
  return list
    .map((t, i) => [t, i])
    .sort((a, b) => a[0].date.localeCompare(b[0].date) || TYPE_ORDER[a[0].type] - TYPE_ORDER[b[0].type] || a[1] - b[1])
    .map((x) => x[0]);
}

// ---------- 알림 ----------
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4000 + 1500 * (msg.split('\n').length - 1)); // 줄이 많으면 더 오래
}

// ---------- 그리기 ----------
// 이번에 보고 있는 달의 수입·지출 합계 (이체는 넣지 않음)
function monthTotals() {
  const key = monthKey(state.year, state.month);
  let income = 0, expense = 0;
  for (const t of state.data ? state.data.transactions : []) {
    if (!t.date || t.date.slice(0, 7) !== key || !memberMatch(t)) continue;
    if (t.type === 'income') income += t.amount;
    else if (t.type === 'expense') expense += t.amount;
  }
  return { income, expense, total: income - expense };
}

function renderTopbar() {
  $('#monthLabel').textContent = `${state.year}년 ${state.month}월`;
  fillMemberFilter($('#memberSel'), '전체');
  const { income, expense, total } = monthTotals();
  $('#monthSummary').innerHTML =
    `수입 <b class="amt-income">${signed(income, '+')}</b> · ` +
    `지출 <b class="amt-expense">${signed(expense, '-')}</b> · ` +
    `합계 <b>${signed(total, total < 0 ? '-' : '+')}</b>`;
}

function renderStatus() {
  const el = $('#saveStatus');
  el.classList.toggle('error', state.locked);
  if (state.locked) el.textContent = '⚠ 불러오기 실패';
  else if (state.savedAt) el.innerHTML = `✓ <span class="ss-word">저장됨 </span>${pad(state.savedAt.getHours())}:${pad(state.savedAt.getMinutes())}`; // 휴대폰 배치는 「✓ 17:14」
  else el.textContent = '';
}

function renderTabs() {
  document.querySelectorAll('.tab').forEach((b) => {
    const on = b.dataset.tab === state.tab;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on);
  });
  document.querySelectorAll('.view').forEach((v) => {
    v.classList.toggle('active', v.id === 'view-' + state.tab);
  });
}

// 모든 화면 다시 그리기
function renderAll() {
  renderTopbar();
  renderStatus();
  renderTabs();
  renderCalendar();
  renderList();
  renderStats();
  renderSidebar();
  renderSettings();
}

// ---------- 가족 사용자 (18장) ----------
const MEMBER_SHARED = '_shared';
const memberById = (id) => (state.data && state.data.members || []).find((m) => m.id === id);
// 상단바에서 고른 사용자의 거래인지
function memberMatch(t) {
  if (!state.member) return true;
  if (state.member === MEMBER_SHARED) return !t.member || !memberById(t.member);
  return t.member === state.member;
}
// 사용자 고르기 칸 채우기: 전체 / 사용자들 / 공동 (숨긴 사용자는 고른 상태일 때만)
function fillMemberFilter(sel, allLabel) {
  if (!state.data) return;
  const list = state.data.members.filter((m) => !m.hidden || m.id === state.member);
  if (state.member && state.member !== MEMBER_SHARED && !memberById(state.member)) state.member = '';
  sel.innerHTML = `<option value="">${allLabel}</option>` +
    list.map((m) => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.name)}</option>`).join('') +
    `<option value="${MEMBER_SHARED}">공동</option>`;
  sel.value = state.member;
}
// 결제수단을 이 사용자가 쓰는지 (쓰는 사람이 비어 있으면 모두가 씀)
const accountUsedBy = (a, memberId) => !a.members || !a.members.length || a.members.includes(memberId);
// 사용자 이름표 (사용자 색)
function memberTag(t) {
  const m = t.member && memberById(t.member);
  if (!m) return '';
  return `<span class="who" style="background:var(--c-${m.color || 'gray'}-bg);color:var(--c-${m.color || 'gray'}-text)">${escapeHtml(m.name)}</span>`;
}
// 옛 자료에 members가 없으면 빈 목록으로
function normalizeData(d) {
  if (!Array.isArray(d.members)) d.members = [];
  return d;
}

// ---------- 날짜·거래 도구 ----------
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
function dateStr(y, m, d) { return `${y}-${pad(m)}-${pad(d)}`; }
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
// "11월 6일 (금)"
function dayLabel(s) { const d = parseDate(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`; }
function txOn(date) { return sortTransactions(state.data ? state.data.transactions.filter((t) => t.date === date && memberMatch(t)) : []); }
function dayTotals(list) {
  let income = 0, expense = 0;
  for (const t of list) { if (t.type === 'income') income += t.amount; else if (t.type === 'expense') expense += t.amount; }
  return { income, expense };
}
const catById = (id) => state.data.categories.find((c) => c.id === id);
const acctById = (id) => state.data.accounts.find((a) => a.id === id);

// ---------- 달력 탭 (4장) ----------
function renderCalendar() {
  const head = $('#calWeekHead');
  if (!head.childElementCount) {
    head.innerHTML = WEEKDAYS.map((w, i) => `<div class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
  }
  const grid = $('#calGrid');
  const first = new Date(state.year, state.month - 1, 1);
  const days = new Date(state.year, state.month, 0).getDate();
  const weeks = Math.ceil((first.getDay() + days) / 7); // 그 달이 걸친 주 수 (4~6)
  grid.style.gridTemplateRows = `repeat(${weeks}, 1fr)`;
  const start = new Date(state.year, state.month - 1, 1 - first.getDay());
  const today = todayStr();
  // 날짜별로 거래 모으기
  const byDate = new Map();
  for (const t of state.data ? state.data.transactions : []) {
    if (!memberMatch(t)) continue;
    if (!byDate.has(t.date)) byDate.set(t.date, []);
    byDate.get(t.date).push(t);
  }
  let html = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const ds = dateStr(d.getFullYear(), d.getMonth() + 1, d.getDate());
    const list = sortTransactions(byDate.get(ds) || []);
    const { income, expense } = dayTotals(list);
    const cls = ['cal-cell'];
    if (d.getMonth() !== state.month - 1) cls.push('other');
    if (d.getDay() === 0) cls.push('sun');
    if (d.getDay() === 6) cls.push('sat');
    if (ds === today) cls.push('today');
    if (ds === state.selectedDate) cls.push('selected');
    let sum = '';
    if (income) sum += `<div class="amt-income">+${fmt(income)}</div>`;
    if (expense) sum += `<div class="amt-expense">-${fmt(expense)}</div>`;
    // 이체(적금·청약 등)는 회색 합계 줄로 따로 (수입·지출 합계와 예산에는 넣지 않음)
    const transfer = list.filter((t) => t.type === 'transfer').reduce((s, t) => s + t.amount, 0);
    if (transfer) sum += `<div class="amt-transfer">↔ ${fmt(transfer)}</div>`;
    // 이모티콘 최대 4개, 더 있으면 +n (이체는 ↔). 끌어서 다른 날짜로 옮길 수 있음 (14장)
    const withEmoji = list;
    let em = withEmoji.slice(0, 4).map((t) => {
      let icon, tip;
      if (t.type === 'transfer') {
        const a = acctById(t.account), to = acctById(t.to);
        icon = '↔'; tip = `이체 ${a ? a.name : '?'} → ${to ? to.name : '?'} ${t.memo || ''}`;
      } else {
        const c = catById(t.category) || {};
        icon = c.emoji || '•'; tip = `${c.name || ''} ${t.memo || ''}`;
      }
      return `<span class="cal-emo${t.type === 'transfer' ? ' transfer' : ''}" draggable="true" data-id="${escapeHtml(t.id)}" title="${escapeHtml(tip.trim())}">${escapeHtml(icon)}</span>`;
    }).join('');
    if (withEmoji.length > 4) em += `<span class="more">+${withEmoji.length - 4}</span>`;
    html += `<div class="${cls.join(' ')}" data-date="${ds}">` +
      `<div><span class="dnum">${d.getDate()}</span></div>` +
      `<div class="cal-sum">${sum}</div><div class="cal-emojis">${em}</div></div>`;
  }
  grid.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 날짜 클릭 → 사이드바에 그날 거래 (달력을 다시 그리지 않아 더블클릭이 끊기지 않게)
function selectDate(ds) {
  state.selectedDate = ds;
  state.sidePanel = 'day';
  document.querySelectorAll('.cal-cell.selected').forEach((c) => c.classList.remove('selected'));
  const cell = document.querySelector(`.cal-cell[data-date="${ds}"]`);
  if (cell) cell.classList.add('selected');
  renderSidebar();
  openSheet(); // 휴대폰 배치면 그날 거래 창이 아래에서 올라옴 (20장)
}

// 날짜 선택 풀기 → 사이드바는 계좌·카드 화면으로 (휴대폰 배치면 아래 창도 닫힘)
function clearSelectedDate() {
  state.selectedDate = null;
  state.sidePanel = 'accounts';
  document.querySelectorAll('.cal-cell.selected').forEach((c) => c.classList.remove('selected'));
  closeSheet();
}

$('#calGrid').addEventListener('click', (e) => {
  const cell = e.target.closest('.cal-cell');
  if (!cell) return;
  if (e.detail > 1) return; // 더블클릭의 두 번째 누름은 아래 dblclick에서 처리
  // 고른 날짜를 한 번 더 누르면 선택이 풀림
  if (state.sidePanel === 'day' && state.selectedDate === cell.dataset.date) { clearSelectedDate(); renderSidebar(); }
  else selectDate(cell.dataset.date);
});
$('#calGrid').addEventListener('dblclick', (e) => {
  const cell = e.target.closest('.cal-cell');
  if (!cell) return;
  selectDate(cell.dataset.date); // 고른 날짜를 더블클릭해도 그 날짜는 고른 채로
  openTxModal({ date: cell.dataset.date });
});

// ---------- 끌어서 옮기기 (14장): 날짜만 바뀜, 반복·할부도 그 회차만 ----------
const DRAG_TYPE = 'application/x-ledger-tx';
document.addEventListener('dragstart', (e) => {
  const src = e.target.closest && e.target.closest('.cal-emo[data-id], .tx-card[data-id][draggable="true"]');
  if (!src || state.locked) return;
  e.dataTransfer.setData(DRAG_TYPE, src.dataset.id);
  e.dataTransfer.setData('text/plain', src.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  document.body.classList.add('dragging-tx');
});
document.addEventListener('dragend', () => {
  document.body.classList.remove('dragging-tx');
  document.querySelectorAll('.cal-cell.drop-over').forEach((c) => c.classList.remove('drop-over'));
});
$('#calGrid').addEventListener('dragover', (e) => {
  const cell = e.target.closest('.cal-cell');
  if (!cell || !e.dataTransfer.types.includes(DRAG_TYPE)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.cal-cell.drop-over').forEach((c) => c !== cell && c.classList.remove('drop-over'));
  cell.classList.add('drop-over');
});
$('#calGrid').addEventListener('dragleave', (e) => {
  const cell = e.target.closest('.cal-cell');
  if (cell && !cell.contains(e.relatedTarget)) cell.classList.remove('drop-over');
});
$('#calGrid').addEventListener('drop', (e) => {
  const cell = e.target.closest('.cal-cell');
  const id = e.dataTransfer.getData(DRAG_TYPE);
  if (!cell || !id) return;
  e.preventDefault();
  cell.classList.remove('drop-over');
  moveTxDate(id, cell.dataset.date);
});
function moveTxDate(id, date) {
  const t = state.data.transactions.find((x) => x.id === id);
  if (!t || t.date === date) return;
  commit((d) => { const x = d.transactions.find((y) => y.id === id); if (x) x.date = date; });
}

// ---------- 사이드바 (6장) ----------
const KIND_LABEL = { cash: '현금', bank: '통장', card: '카드' };

// ---------- 카드대금 (9장) ----------
// 저장하는 거래가 아니라 계산으로 보여 주는 자동 줄. 지출 합계·예산·통계에는 넣지 않는다.
const lastDayOf = (y, m) => new Date(y, m, 0).getDate();
function addMonths(ym, n) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return monthKey(d.getFullYear(), d.getMonth() + 1);
}
// 사용일이 그 달 마감일 이하면 그 달 묶음, 넘으면 다음 달 묶음 (마감일 31 = 말일)
function bundleOf(card, date) {
  const ym = date.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);
  const cut = Math.min(card.card.cutoffDay, lastDayOf(y, m));
  return Number(date.slice(8, 10)) <= cut ? ym : addMonths(ym, 1);
}
// 묶음은 다음 달 결제일에 출금
function payDateOf(card, bundle) {
  const [y, m] = addMonths(bundle, 1).split('-').map(Number);
  return dateStr(y, m, Math.min(card.card.paymentDay, lastDayOf(y, m)));
}
const isCardWithRule = (a) => a && a.kind === 'card' && a.card && a.card.cutoffDay && a.card.paymentDay;

// 어떤 날 뒤의 첫 결제일
function firstPayDateAfter(card, date) {
  let ym = date.slice(0, 7);
  for (let i = 0; i < 2; i++) {
    const [y, m] = ym.split('-').map(Number);
    const d = dateStr(y, m, Math.min(card.card.paymentDay, lastDayOf(y, m)));
    if (d > date) return d;
    ym = addMonths(ym, 1);
  }
  return null;
}

// 카드대금 자동 줄 전체: 카드·결제일마다 하나 (결제일이 오늘 이전·당일이면 출금된 것으로 봄)
// 카드의 처음 미결제 금액(opening)은 등록한 날(openingDate) 뒤의 첫 결제일에 함께 출금
function cardPayments() {
  if (!state.data) return [];
  const today = todayStr();
  const out = [];
  for (const c of state.data.accounts) {
    if (!isCardWithRule(c)) continue;
    const sums = new Map(); // 결제일 → 금액
    for (const t of state.data.transactions) {
      if (t.type !== 'expense' || t.account !== c.id) continue;
      const d = payDateOf(c, bundleOf(c, t.date));
      sums.set(d, (sums.get(d) || 0) + t.amount);
    }
    if (c.opening > 0 && c.openingDate) {
      const d = firstPayDateAfter(c, c.openingDate);
      sums.set(d, (sums.get(d) || 0) + c.opening);
    }
    for (const [date, amount] of sums) {
      out.push({ auto: true, id: `auto-${c.id}-${date}`, type: 'cardpay', date, amount, account: c.card.payFrom, to: c.id, paid: date <= today });
    }
  }
  return out;
}

// 다음 결제: 오늘 뒤의 첫 결제일과 그날 출금될 금액
function nextCardPayment(c) {
  const date = firstPayDateAfter(c, todayStr());
  const p = cardPayments().find((x) => x.to === c.id && x.date === date);
  return { date, amount: p ? p.amount : 0 };
}

// 사용자를 골랐을 때 자동 줄을 보여 줄지: 그 사용자가 쓰는 카드의 대금만 (공동은 쓰는 사람 없는 카드)
function autoRowVisible(r) {
  if (!state.member) return true;
  const c = acctById(r.to);
  if (!c) return false;
  if (state.member === MEMBER_SHARED) return !c.members || !c.members.length;
  return accountUsedBy(c, state.member);
}

// 오늘까지의 거래로 계좌 잔액 계산 (카드는 미결제 금액), 출금된 카드대금 반영 (9장)
function accountBalances() {
  const today = todayStr();
  const bal = new Map(state.data.accounts.map((a) => [a.id, a.opening || 0]));
  for (const t of state.data.transactions) {
    if (t.date > today) continue;
    const a = acctById(t.account);
    if (!a) continue;
    if (a.kind === 'card') { if (t.type === 'expense') bal.set(a.id, bal.get(a.id) + t.amount); continue; }
    if (t.type === 'income') bal.set(a.id, bal.get(a.id) + t.amount);
    else if (t.type === 'expense') bal.set(a.id, bal.get(a.id) - t.amount);
    else if (t.type === 'transfer') {
      bal.set(a.id, bal.get(a.id) - t.amount);
      if (bal.has(t.to)) bal.set(t.to, bal.get(t.to) + t.amount);
    }
  }
  // 결제일이 지난 카드대금: 출금 통장 잔액 −, 카드 미결제 −
  for (const p of cardPayments()) {
    if (!p.paid) continue;
    if (bal.has(p.account)) bal.set(p.account, bal.get(p.account) - p.amount);
    bal.set(p.to, bal.get(p.to) - p.amount);
  }
  return bal;
}

function txCardHtml(t) {
  let bg, fg, emoji, name, meta, amt;
  const acct = acctById(t.account);
  if (t.auto) {
    // 카드대금 자동 줄: 고칠 수 없음
    const card = acctById(t.to);
    return `<div class="tx-card auto" style="background:var(--c-gray-bg);color:var(--c-gray-text)">` +
      `<span class="emoji">↔</span><div class="info"><div class="cat">카드대금 (자동)</div>` +
      `<div class="meta">${escapeHtml(`${acct ? acct.name : '?'} → ${card ? card.name : '?'}${t.paid ? '' : ' (예정)'}`)}</div></div>` +
      `<span class="amt amt-transfer">↔ ${fmt(t.amount)}</span></div>`;
  }
  if (t.type === 'transfer') {
    bg = 'var(--c-gray-bg)'; fg = 'var(--c-gray-text)'; emoji = '↔'; name = '이체';
    const to = acctById(t.to);
    meta = [`${acct ? acct.name : '?'} → ${to ? to.name : '?'}`, t.memo].filter(Boolean).join(' · ');
    amt = `<span class="amt amt-transfer">↔ ${fmt(t.amount)}</span>`;
  } else {
    const c = catById(t.category) || { color: 'gray', emoji: '•', name: '분류 없음' };
    bg = `var(--c-${c.color}-bg)`; fg = `var(--c-${c.color}-text)`; emoji = c.emoji; name = c.name;
    meta = [t.memo, acct && acct.name].filter(Boolean).join(' · ');
    amt = t.type === 'income'
      ? `<span class="amt amt-income">+${fmt(t.amount)}</span>`
      : `<span class="amt amt-expense">-${fmt(t.amount)}</span>`;
  }
  return `<div class="tx-card" data-id="${escapeHtml(t.id)}" draggable="true" style="background:${bg};color:${fg}">` +
    `<span class="emoji">${escapeHtml(emoji)}</span>` +
    `<div class="info"><div class="cat">${escapeHtml(name)}</div><div class="meta">${memberTag(t)}${escapeHtml(meta)}</div></div>${amt}</div>`;
}

function renderSidebar() {
  const sb = $('#sidebar');
  const floating = !!layout.floating;
  $('#sideFloat').textContent = floating ? '▭' : '⧉';
  $('#sideFloat').title = floating ? '고정' : '띄우기';
  applyLayout();
  renderBudgetBar();
  const body = $('#sideBody'), foot = $('#sideFoot');
  if (!state.data) { $('#sideTitle').textContent = ''; $('#sideSub').textContent = ''; body.innerHTML = ''; foot.innerHTML = ''; return; }

  if (state.sidePanel === 'day' && state.selectedDate) {
    const list = txOn(state.selectedDate);
    const { income, expense } = dayTotals(list);
    // 그날 카드대금 자동 줄도 맨 아래에 (합계에는 넣지 않음)
    const autos = cardPayments().filter((p) => p.date === state.selectedDate && autoRowVisible(p));
    const all = [...list, ...autos];
    $('#sideTitle').textContent = dayLabel(state.selectedDate);
    $('#sideSub').innerHTML = `수입 <b class="amt-income">+${fmt(income)}</b> · 지출 <b class="amt-expense">-${fmt(expense)}</b>`;
    body.innerHTML = all.length ? all.map(txCardHtml).join('') : '<div class="side-empty">거래가 없습니다.</div>';
    foot.innerHTML = '<button type="button" class="primary-btn side-add" id="sideAdd">+ 이 날짜에 거래 추가</button>';
    return;
  }

  // 계좌·카드 목록
  $('#sideTitle').textContent = '계좌·카드';
  $('#sideSub').textContent = '';
  const bal = accountBalances();
  const today = todayStr(), thisMonth = today.slice(0, 7);
  let net = 0, html = '';
  // 사용자를 골랐으면 그 사용자가 쓰는 결제수단만 (18장)
  const byMember = state.member && state.member !== MEMBER_SHARED;
  for (const a of state.data.accounts) {
    if (byMember && !accountUsedBy(a, state.member)) continue;
    const b = bal.get(a.id) || 0;
    net += a.kind === 'card' ? -b : b;
    if (a.hidden) continue;
    let meta = '', right;
    if (a.kind === 'card') {
      const used = state.data.transactions
        .filter((t) => t.type === 'expense' && t.account === a.id && t.date.startsWith(thisMonth + '-') && t.date <= today)
        .reduce((s, t) => s + t.amount, 0);
      meta = `이번 달 사용 ${fmt(used)}원`;
      if (isCardWithRule(a)) {
        const next = nextCardPayment(a);
        const d = parseDate(next.date);
        meta += ` · 다음 결제 ${d.getMonth() + 1}월 ${d.getDate()}일 ${fmt(next.amount)}원`;
      }
      right = '';
    } else {
      right = `<span class="bal${b < 0 ? ' neg' : ''}">${b < 0 ? '-' : ''}${fmt(b)}원</span>`;
    }
    html += `<button type="button" class="acct-row" data-id="${escapeHtml(a.id)}">` +
      `<span class="acct-dot" style="background:var(--c-${a.color || 'gray'}-strong)"></span>` +
      `<div class="info"><div class="name">${escapeHtml(a.name)}<span class="kind">${KIND_LABEL[a.kind] || ''}</span></div>` +
      (meta ? `<div class="meta num">${meta}</div>` : '') + `</div>${right}</button>`;
  }
  body.innerHTML = html;
  foot.innerHTML = `<div class="net-worth"><span>순자산</span><span>${net < 0 ? '-' : ''}${fmt(net)}원</span></div>`;
}

// ---------- 사이드바 배치: 너비 260~800, 띄우기/고정 (localStorage ledger-edu.layout.v1) ----------
const LAYOUT_KEY = 'ledger-edu.layout.v1';
const layout = (() => {
  const def = { width: 360, floating: false, x: null, y: null };
  try { return { ...def, ...JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}') }; } catch { return def; }
})();
function saveLayout() { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch {} }
const clampWidth = (w) => Math.min(800, Math.max(260, Math.round(w)));

function applyLayout() {
  const sb = $('#sidebar');
  if (isMobile()) { // 휴대폰 배치: 너비·띄우기는 쓰지 않음 (저장된 값은 PC 화면용으로 그대로)
    sb.classList.remove('floating');
    sb.style.width = sb.style.left = sb.style.top = sb.style.height = '';
    return;
  }
  layout.width = clampWidth(layout.width);
  sb.style.width = layout.width + 'px';
  sb.classList.toggle('floating', !!layout.floating);
  if (layout.floating) {
    const h = Math.min(window.innerHeight - 32, Math.max(300, window.innerHeight * 0.7));
    if (layout.x === null) layout.x = window.innerWidth - layout.width - 24;
    if (layout.y === null) layout.y = 80;
    layout.x = Math.min(Math.max(0, layout.x), Math.max(0, window.innerWidth - layout.width));
    layout.y = Math.min(Math.max(0, layout.y), Math.max(0, window.innerHeight - h));
    sb.style.left = layout.x + 'px';
    sb.style.top = layout.y + 'px';
    sb.style.height = h + 'px';
  } else {
    sb.style.left = sb.style.top = sb.style.height = '';
  }
}

// 끌기 도우미
function dragging(e, onMove) {
  const move = (ev) => onMove(ev);
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); document.body.style.userSelect = ''; saveLayout(); };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
  document.body.style.userSelect = 'none';
  e.preventDefault();
}

// 왼쪽 가장자리를 끌어 너비 조절
$('#sideResize').addEventListener('mousedown', (e) => {
  const startX = e.clientX, startW = layout.width, startLeft = layout.x;
  dragging(e, (ev) => {
    const w = clampWidth(startW + (startX - ev.clientX));
    if (layout.floating) layout.x = startLeft + (startW - w); // 띄운 상태에서는 오른쪽 끝 고정
    layout.width = w;
    applyLayout();
  });
});
// 띄운 상태에서 머리줄을 끌어 이동
$('#sideHead').addEventListener('mousedown', (e) => {
  if (!layout.floating || e.target.closest('button')) return;
  const dx = e.clientX - layout.x, dy = e.clientY - layout.y;
  dragging(e, (ev) => { layout.x = ev.clientX - dx; layout.y = ev.clientY - dy; applyLayout(); });
});
$('#sideFloat').addEventListener('click', () => {
  layout.floating = !layout.floating;
  if (layout.floating) { layout.x = null; layout.y = null; }
  renderSidebar(); // 위치 계산 뒤 저장
  saveLayout();
});
window.addEventListener('resize', () => { if (layout.floating) applyLayout(); });

// ---------- 불러오기 ----------
// 서버 자료 받기. 같은 판이면 304로 그대로 둔다.
async function loadFromServer() {
  let r;
  try {
    r = await fetch('/api/data', { cache: 'no-store', headers: state.rev && !state.locked ? { 'If-None-Match': state.rev } : {} });
  } catch {
    if (!state.data) { state.locked = true; renderAll(); }
    return; // 서버가 잠깐 안 보이면 다음 확인 때 다시
  }
  if (r.status === 304) return;
  if (!r.ok) { state.locked = true; renderAll(); return; }
  const d = normalizeData(await r.json());
  state.data = d;
  state.base = clone(d);
  state.rev = r.headers.get('X-Revision');
  state.locked = false;
  renderAll();
}

// ---------- 저장 (13장) ----------
// 내가 바꾼 거래·계좌·분류·예산만 최신 자료 위에 다시 얹기 (같은 항목은 나중 저장이 남음)
function mergeChanges(base, mine, latest) {
  const out = clone(latest);
  normalizeData(out);
  for (const key of ['transactions', 'accounts', 'categories', 'members']) {
    const b = new Map(base[key].map((x) => [x.id, x]));
    const m = new Map(mine[key].map((x) => [x.id, x]));
    let arr = out[key];
    for (const id of b.keys()) if (!m.has(id)) arr = arr.filter((x) => x.id !== id); // 내가 지운 것
    for (const [id, x] of m) {
      const bx = b.get(id);
      if (bx && JSON.stringify(bx) === JSON.stringify(x)) continue; // 안 바꾼 것
      const i = arr.findIndex((y) => y.id === id);
      if (i >= 0) arr[i] = clone(x); else arr.push(clone(x)); // 바꾼 것·새로 만든 것
    }
    out[key] = arr;
  }
  const months = new Set([...Object.keys(base.budgets), ...Object.keys(mine.budgets)]);
  for (const k of months) {
    if (JSON.stringify(base.budgets[k]) === JSON.stringify(mine.budgets[k])) continue;
    if (mine.budgets[k] === undefined) delete out.budgets[k];
    else out.budgets[k] = clone(mine.budgets[k]);
  }
  return out;
}

let saveChain = Promise.resolve(true);

// 자료 바꾸기: 화면에 먼저 반영하고 저장. 실패하면 이전 상태로 되돌림.
function commit(mutate) {
  if (state.locked || !state.data) { toast('⚠ 불러오기 실패 상태라 저장할 수 없습니다.'); return Promise.resolve(false); }
  const next = clone(state.data);
  mutate(next);
  state.data = next;
  state.dirty = true;
  renderAll();
  saveChain = saveChain.then(doSave);
  return saveChain;
}

async function doSave() {
  if (!state.dirty) return true;
  state.saving = true;
  state.dirty = false;
  let sending = clone(state.data);
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const r = await fetch('/api/data', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'If-Match': state.rev },
        body: JSON.stringify(sending),
      });
      if (r.ok) {
        const j = await r.json();
        state.rev = j.revision;
        state.base = sending;
        state.savedAt = new Date();
        if (!state.dirty) state.data = clone(sending);
        renderAll();
        return true;
      }
      if (r.status !== 409) throw new Error((await r.json().catch(() => ({}))).error || '저장 실패');
      // 그사이 다른 쪽이 바꿈 → 최신 자료 위에 내 변경만 다시 얹기
      const lr = await fetch('/api/data', { cache: 'no-store' });
      if (!lr.ok) throw new Error('최신 자료를 받지 못했습니다.');
      const latest = normalizeData(await lr.json());
      const merged = mergeChanges(state.base, sending, latest);
      if (state.dirty) state.data = mergeChanges(sending, state.data, merged); // 저장 중에 더 바꾼 것 유지
      else state.data = clone(merged);
      sending = merged;
      state.base = latest;
      state.rev = lr.headers.get('X-Revision');
    }
    throw new Error('여러 번 겹쳐서 저장하지 못했습니다.');
  } catch (e) {
    // 저장 실패: 화면을 마지막으로 저장된 상태로 되돌림
    state.data = clone(state.base);
    state.dirty = false;
    renderAll();
    toast(`저장하지 못해 이전 상태로 되돌렸습니다. (${e.message})`);
    return false;
  } finally {
    state.saving = false;
  }
}

// 30초마다 판 확인 (구글 서버) (입력창이 열렸거나 저장 중이면 쉼)
setInterval(() => {
  if (state.modalOpen || state.saving || state.dirty) return;
  loadFromServer();
}, 30000);

// ---------- 목록 탭 (5장) · 검색 (14장) ----------
// 거르기 기간 [시작, 끝] (YYYY-MM-DD)
function listRange() {
  const L = state.list;
  if (L.period === 'custom') return [L.from || '0000-01-01', L.to || '9999-12-31'];
  const off = L.period === 'last' ? -1 : 0;
  const d = new Date(state.year, state.month - 1 + off, 1);
  const y = d.getFullYear(), m = d.getMonth() + 1;
  return [dateStr(y, m, 1), dateStr(y, m, new Date(y, m, 0).getDate())];
}

// 검색어: ">50000" "<10000" "=9000"은 금액, 그 밖은 메모·장소·분류 이름
function matchQuery(t, q) {
  q = q.trim();
  if (!q) return true;
  const m = /^([<>=])\s*([\d,]+)$/.exec(q);
  if (m) {
    const n = Number(m[2].replace(/,/g, ''));
    return m[1] === '>' ? t.amount > n : m[1] === '<' ? t.amount < n : t.amount === n;
  }
  const c = t.category ? catById(t.category) : null;
  const hay = [t.memo, t.place, c && c.name].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

// 목록 탭에서 거른 결과 (CSV 내보내기도 이 결과를 씀 — 12장)
function filteredTransactions() {
  if (!state.data) return [];
  const L = state.list;
  const [from, to] = listRange();
  return state.data.transactions.filter((t) =>
    t.date >= from && t.date <= to &&
    (L.type === 'all' || t.type === L.type) &&
    (!L.category || t.category === L.category || L.category === '@' + t.type) && // '@expense'=지출 전체, '@income'=수입 전체
    (!L.account || t.account === L.account || t.to === L.account) &&
    memberMatch(t) &&
    matchQuery(t, L.q));
}

// 목록에 함께 보일 카드대금 자동 줄 (종류 전체·이체일 때만, 분류를 고르면 빠짐)
function filteredAutoRows() {
  const L = state.list;
  if (!(L.type === 'all' || L.type === 'transfer') || L.category) return [];
  const [from, to] = listRange();
  return cardPayments().filter((p) => {
    if (p.date < from || p.date > to) return false;
    if (L.account && p.account !== L.account && p.to !== L.account) return false;
    if (!autoRowVisible(p)) return false;
    const card = acctById(p.to);
    return matchQuery({ amount: p.amount, memo: `카드대금 ${card ? card.name : ''}` }, L.q);
  });
}

// 분류·결제수단 고르기 칸 채우기 (고른 값 유지)
function fillListSelects() {
  const catSel = $('#fCategory'), accSel = $('#fAccount');
  const L = state.list;
  const opt = (v, text) => `<option value="${escapeHtml(v)}">${escapeHtml(text)}</option>`;
  const group = (type, label) => {
    const list = state.data.categories.filter((c) => c.type === type);
    return list.length ? `<optgroup label="${label}">` + opt('@' + type, `${label} 전체`) +
      list.map((c) => opt(c.id, `${c.emoji || ''} ${c.name}${c.hidden ? ' (숨김)' : ''}`)).join('') + '</optgroup>' : '';
  };
  catSel.innerHTML = opt('', '전체 분류') + group('expense', '지출') + group('income', '수입');
  accSel.innerHTML = opt('', '전체 결제수단') +
    state.data.accounts.map((a) => opt(a.id, a.name + (a.hidden ? ' (숨김)' : ''))).join('');
  if (!['@expense', '@income'].includes(L.category) && !state.data.categories.some((c) => c.id === L.category)) L.category = '';
  if (!state.data.accounts.some((a) => a.id === L.account)) L.account = '';
  catSel.value = L.category;
  accSel.value = L.account;
}

function listRowHtml(t) {

function renderList() {
  if (!state.data) { $('#listTotal').textContent = ''; $('#listScroll').innerHTML = ''; return; }
  const L = state.list;
  // 기간 이름에 어느 달인지 표시
  const [tf] = (() => { const s = L.period; L.period = 'this'; const r = listRange(); L.period = s; return r; })();
  const lastD = new Date(state.year, state.month - 2, 1);
  $('#fPeriod').options[0].textContent = `이번 달 (${Number(tf.slice(5, 7))}월)`;
  $('#fPeriod').options[1].textContent = `지난달 (${lastD.getMonth() + 1}월)`;
  $('#fPeriod').value = L.period;
  $('#fCustom').hidden = L.period !== 'custom';
  $('#fType').value = L.type;
  fillListSelects();
  fillMemberFilter($('#fMember'), '전체 사용자');

  const list = filteredTransactions();
  const { income, expense } = dayTotals(list);
  $('#listTotal').innerHTML = `수입 <b class="amt-income">+${fmt(income)}</b> · 지출 <b class="amt-expense">-${fmt(expense)}</b>`;

  // 날짜별로 묶어 최신 날짜부터 (카드대금 자동 줄은 그날 맨 아래, 합계에는 넣지 않음)
  const byDate = new Map();
  for (const t of sortTransactions([...list, ...filteredAutoRows()])) {
    if (!byDate.has(t.date)) byDate.set(t.date, []);
    byDate.get(t.date).push(t);
  }
  const dates = [...byDate.keys()].sort().reverse();
  let html = '';
  for (const d of dates) {
    const day = byDate.get(d);
    const s = dayTotals(day);
    const sums = (s.income ? `<span class="amt-income">+${fmt(s.income)}</span>` : '') +
      (s.expense ? `<span class="amt-expense">-${fmt(s.expense)}</span>` : '');
    html += `<div class="day-group"><div class="day-head"><span>${dayLabel(d)}</span><span class="sums">${sums}</span></div>` +
      day.map(listRowHtml).join('') + '</div>';
  }
  $('#listScroll').innerHTML = html || '<div class="list-empty">거래가 없습니다.</div>';
}

const MAX_AMOUNT = 9900000000; // 최대 99억
// 종류별로 고를 수 있는 계좌 종류 (이체는 카드 제외 — 자동 카드대금과 겹치지 않게)
const ACCOUNT_KINDS = { expense: ['cash', 'bank', 'card'], income: ['cash', 'bank'], transfer: ['cash', 'bank'] };

const txm = { original: null, type: 'expense', category: null, pendingAccount: null, member: '' };

// 계좌 목록 (숨긴 계좌는 빼되, 지금 거래가 쓰는 계좌는 보여 줌)
function accountsFor(type, keepIds = []) {
  return state.data.accounts.filter((a) =>
    ACCOUNT_KINDS[type].includes(a.kind) && (!a.hidden || keepIds.includes(a.id)));
}

// 결제수단 고르기 칸 채우기. grouped면 고른 사용자가 쓰는 것 먼저, 나머지는 '다른 결제수단' 묶음 (18장)
function fillSelect(sel, list, wanted, grouped = false) {
  sel.innerHTML = '';
  const option = (a) => { const o = document.createElement('option'); o.value = a.id; o.textContent = a.name; return o; };
  let mine = list, others = [];
  if (grouped && txm.member) {
    mine = list.filter((a) => accountUsedBy(a, txm.member));
    others = list.filter((a) => !accountUsedBy(a, txm.member));
  }
  mine.forEach((a) => sel.appendChild(option(a)));
  if (others.length) {
    const g = document.createElement('optgroup');
    g.label = '다른 결제수단';
    others.forEach((a) => g.appendChild(option(a)));
    sel.appendChild(g);
  }
  if (list.some((a) => a.id === wanted)) sel.value = wanted;
}

  txm.pendingAccount = null;

  document.querySelectorAll('.type-tab').forEach((b) => {

  const isTransfer = type === 'transfer';
  $('#txCategoryRow').hidden = isTransfer;

    fillSelect($('#txAccount'), accountsFor(type, [o.account]), prevAccount, true);

}
