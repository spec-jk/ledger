// 금액 칸: 숫자만, 입력하면서 쉼표, 99억까지 (거래 입력창·설정에서 함께 씀)
function formatAmountInput(e) {
  const el = e.target;
  const fromEnd = el.value.length - el.selectionEnd;
  const digits = el.value.replace(/[^0-9]/g, '').replace(/^0+/, '');
  if (digits && Number(digits) > MAX_AMOUNT) { el.value = el.dataset.last || ''; return; }
  const text = digits ? Number(digits).toLocaleString('ko-KR') : '';
  el.value = text;
  el.dataset.last = text;
  const pos = Math.max(0, text.length - fromEnd);
  el.setSelectionRange(pos, pos);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// ---------- 반복·할부 (10장) ----------
const MAX_REPEAT = 366;
const REPEAT_LABEL = { daily: '매일', weekdays: '평일', weekly: '매주', biweekly: '2주마다', monthly: '매월', yearly: '매년' };
const DAY_MS = 86400000;
const dayNum = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY_MS; };
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
// n달 뒤 같은 날 (그 달에 없으면 말일로 당김 — 돈은 빠지면 안 되므로)
function addMonthsClamp(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(y, m - 1 + n, 1);
  const ty = t.getFullYear(), tm = t.getMonth() + 1;
  return dateStr(ty, tm, Math.min(d, lastDayOf(ty, tm)));
}

// 반복 규칙 {freq, days, start, until} → 날짜 목록 (최대 366회 + 1개까지만 만들어 초과를 알 수 있게)
function repeatDates(r) {
  const out = [];
  if (r.until < r.start) return out;
  if (r.freq === 'monthly' || r.freq === 'yearly') {
    const step = r.freq === 'monthly' ? 1 : 12;
    for (let i = 0; out.length <= MAX_REPEAT; i++) {
      const d = addMonthsClamp(r.start, i * step);
      if (d > r.until) break;
      out.push(d);
    }
    return out;
  }
  const s0 = dayNum(r.start);
  const weekStart = s0 - parseDate(r.start).getDay(); // 시작 주의 일요일
  for (let d = r.start; d <= r.until && out.length <= MAX_REPEAT; d = addDays(d, 1)) {
    const wd = parseDate(d).getDay();
    let ok = false;
    if (r.freq === 'daily') ok = true;
    else if (r.freq === 'weekdays') ok = wd >= 1 && wd <= 5;
    else if (r.freq === 'weekly') ok = r.days.includes(wd);
    else if (r.freq === 'biweekly') ok = r.days.includes(wd) && Math.floor((dayNum(d) - weekStart) / 7) % 2 === 0;
    if (ok) out.push(d);
  }
  return out;
}

// 입력창의 반복 칸 읽기 → null(반복 안 함) 또는 규칙
function readRepeat() {
  const freq = $('#txRepeat').value;
  if (freq === 'none' || $('#txRepeat').disabled) return null;
  const days = (freq === 'weekly' || freq === 'biweekly') ? [...txm.days].sort() : [];
  return { freq, days, until: $('#txUntil').value, start: $('#txDate').value };
}
const readMonths = () => ($('#txInstallRow').hidden || $('#txInstall').disabled ? 1 : Number($('#txInstall').value) || 1);

// 할부: 총액을 개월 수로 나눠 매달 같은 날(없으면 말일), 원 단위 나머지는 첫 회차
function installmentAmounts(total, months) {
  const per = Math.floor(total / months);
  return Array.from({ length: months }, (_, i) => per + (i === 0 ? total - per * months : 0));
}

function renderWeekdayPick() {
  const box = $('#txDays');
  box.innerHTML = WEEKDAYS.map((w, i) =>
    `<button type="button" class="weekday-btn${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}${txm.days.includes(i) ? ' selected' : ''}" data-day="${i}" aria-pressed="${txm.days.includes(i)}">${w}</button>`).join('');
}

// 반복·할부 칸 보이기/막기와 안내 문구
function updateRepeatUI() {
  if (!state.data || !txm.type) return;
  const freq = $('#txRepeat').value;
  const acct = acctById($('#txAccount').value);
  const canInstall = txm.type === 'expense' && acct && acct.kind === 'card';
  $('#txInstallRow').hidden = !canInstall;
  const months = readMonths();
  // 반복과 할부는 함께 쓰지 않음
  $('#txRepeat').disabled = months > 1 || !!(txm.original && txm.original.installment);
  $('#txInstall').disabled = freq !== 'none' || !!(txm.original && txm.original.seriesId && !txm.original.installment);
  const repeating = freq !== 'none' && !$('#txRepeat').disabled;
  $('#txDays').hidden = !(repeating && (freq === 'weekly' || freq === 'biweekly'));
  $('#txUntilWrap').hidden = !repeating;
  if (repeating) {
    const r = readRepeat();
    const n = r.until ? repeatDates(r).length : 0;
    $('#txRepeatHint').textContent = n > MAX_REPEAT ? `최대 ${MAX_REPEAT}회까지 등록할 수 있습니다.` : `총 ${n}회 등록됩니다.`;
  } else {
    $('#txRepeatHint').textContent = months > 1 ? '할부 거래는 반복할 수 없습니다.' : '';
  }
  if (canInstall) {
    const total = Number($('#txAmount').value.replace(/,/g, '')) || 0;
    if ($('#txInstall').disabled) $('#txInstallHint').textContent = '반복 거래는 할부를 쓸 수 없습니다.';
    else if (months > 1 && total) {
      const a = installmentAmounts(total, months);
      $('#txInstallHint').textContent = `매달 ${fmt(a[1])}원 × ${months}개월` + (a[0] !== a[1] ? ` (첫 회 ${fmt(a[0])}원)` : '');
    } else $('#txInstallHint').textContent = '';
  }
}

// 수정·삭제 범위 고르기 창 → 고른 값(취소면 null)
function askScope(title, options) {
  return new Promise((resolve) => {
    $('#scopeTitle').textContent = title;
    $('#scopeBody').innerHTML = options.map(([v, label]) => `<button type="button" class="text-btn scope-btn" data-v="${v}">${label}</button>`).join('');
    $('#scopeModal').hidden = false;
    const done = (v) => {
      $('#scopeModal').hidden = true;
      $('#scopeBody').onclick = null; $('#scopeCancel').onclick = null;
      resolve(v);
    };
    $('#scopeBody').onclick = (e) => { const b = e.target.closest('[data-v]'); if (b) done(b.dataset.v); };
    $('#scopeCancel').onclick = () => done(null);
  });
}

// 반복·할부 묶음에 함께 반영하는 항목 (날짜·금액은 따로 다룸)
const SHARED_FIELDS = ['type', 'category', 'account', 'to', 'memo', 'place', 'member'];
// 고친 항목만 다른 회차에 반영 (규칙이 그대로일 때)
function applyChanged(t, edited, orig, fields) {
  for (const f of fields) {
    if (JSON.stringify(edited[f]) === JSON.stringify(orig[f])) continue;
    if (edited[f] === undefined) delete t[f]; else t[f] = edited[f];
  }
}
const sameDays = (a, b) => JSON.stringify([...(a || [])].sort()) === JSON.stringify([...(b || [])].sort());

// 반복 묶음 만들기: 회차마다 따로 저장, seriesId와 repeat을 붙임
// from이 있으면 그 날짜부터만 (기준일·격주 순서를 지키며 중간부터 다시 만들 때)
function makeSeries(base, rule, from = '') {
  const seriesId = makeId();
  const repeat = { freq: rule.freq, days: rule.days, until: rule.until, start: rule.start };
  return repeatDates(rule).filter((d) => d >= from).map((d) => {
    const t = { ...clone(base), id: makeId(), date: d, seriesId, repeat: clone(repeat) };
    delete t.installment;
    return t;
  });
}
// 할부 묶음 만들기
function makeInstallments(base, total, months, firstDate, groupId = makeId()) {
  return installmentAmounts(total, months).map((amount, i) => {
    const t = { ...clone(base), id: makeId(), amount, date: addMonthsClamp(firstDate, i), installment: { groupId, index: i + 1, months, total } };
    delete t.seriesId; delete t.repeat;
    return t;
  });
}

async function saveTx() {
  const amount = Number($('#txAmount').value.replace(/,/g, ''));
  if (!amount) return showTxError('금액을 입력해 주세요.');
  const type = txm.type;
  if (type !== 'transfer' && !txm.category) return showTxError('분류를 골라 주세요.');
  const date = $('#txDate').value;
  if (!date) return showTxError('날짜를 골라 주세요.');
  const account = type === 'transfer' ? $('#txFrom').value : $('#txAccount').value;
  const to = $('#txTo').value;
  if (type === 'transfer' && account === to) return showTxError('보내는 계좌와 받는 계좌가 같습니다.');
  const rule = readRepeat();
  if (rule) {
    if ((rule.freq === 'weekly' || rule.freq === 'biweekly') && !rule.days.length) return showTxError('요일을 골라 주세요.');
    if (!rule.until) return showTxError('반복 종료일을 골라 주세요.');
    if (rule.until < date) return showTxError('반복 종료일이 날짜보다 빠릅니다.');
    if (repeatDates(rule).length > MAX_REPEAT) return showTxError(`최대 ${MAX_REPEAT}회까지 등록할 수 있습니다.`);
  }
  const months = readMonths();
  if (months > 1 && amount < months) return showTxError('할부 금액이 개월 수보다 작습니다.');

  // 이 입력창의 값 (id·날짜·반복·할부 정보 제외)
  const fields = { type, account, memo: $('#txMemo').value.trim() };
  if (type === 'transfer') fields.to = to; else fields.category = txm.category;
  const place = $('#txPlace').value.trim();
  if (place) fields.place = place;
  if (txm.member) fields.member = txm.member; // 없으면 공동

  const orig = txm.original;
  let mutate;
  if (!orig) {
    // 새 거래
    const list = months > 1 ? makeInstallments(fields, amount, months, date)
      : rule ? makeSeries({ ...fields, amount }, rule)
      : [{ ...fields, id: makeId(), date, amount }];
    mutate = (d) => { d.transactions.push(...list); };
  } else if (orig.installment) {
    mutate = await editInstallment(orig, fields, amount, date, months);
  } else if (orig.seriesId) {
    mutate = await editSeries(orig, fields, amount, date, rule);
  } else {
    // 하나짜리 거래 수정 (할부·반복으로 바꿀 수도 있음)
    const list = months > 1 ? makeInstallments(fields, amount, months, date)
      : rule ? makeSeries({ ...fields, amount }, rule)
      : [{ ...fields, id: orig.id, date, amount }];
    mutate = (d) => {
      const i = d.transactions.findIndex((t) => t.id === orig.id);
      if (i >= 0) d.transactions.splice(i, 1, ...list); else d.transactions.push(...list);
    };
  }
  if (!mutate) return; // 범위 고르기에서 취소했거나 막힘
  closeTxModal();
  // 새로 생기거나 바뀐 지출 → 저장 뒤 예산 초과 알림 (저장은 그대로 함, 7장)
  const before = new Map(state.data.transactions.map((t) => [t.id, JSON.stringify(t)]));
  const ok = await commit(mutate);
  if (!ok) return;
  const touched = state.data.transactions.filter((t) => t.type === 'expense' && before.get(t.id) !== JSON.stringify(t));
  const msgs = overBudgetMessages(touched);
  if (msgs.length) toast(msgs.length > 4 ? [...msgs.slice(0, 4), `… 외 ${msgs.length - 4}건`].join('\n') : msgs.join('\n'));
}

// 반복 거래 수정: 이 거래만 / 이후 모든 거래 / 전체 반복 거래
async function editSeries(orig, fields, amount, date, rule) {
  const scope = await askScope('반복 거래 수정', [['one', '이 거래만'], ['after', '이후 모든 거래'], ['all', '전체 반복 거래']]);
  if (!scope) return null;
  const edited = { ...fields, amount };
  const sid = orig.seriesId;
  const ruleSame = rule && rule.freq === orig.repeat.freq && sameDays(rule.days, orig.repeat.days) &&
    rule.until === orig.repeat.until && date === orig.date;
  const fieldsToApply = [...SHARED_FIELDS, 'amount'];

  if (scope === 'one') {
    return (d) => {
      const t = d.transactions.find((x) => x.id === orig.id);
      if (!t) return;
      SHARED_FIELDS.forEach((f) => delete t[f]);
      Object.assign(t, edited, { date });
      if (!rule) { delete t.seriesId; delete t.repeat; } // 반복 안 함으로 바꾸면 이 거래만 빠짐
    };
  }
  if (ruleSame) {
    // 규칙이 그대로면 고친 항목만 반영
    return (d) => {
      for (const t of d.transactions) {
        if (t.seriesId !== sid) continue;
        if (scope === 'after' && t.date < orig.date) continue;
        applyChanged(t, edited, orig, fieldsToApply);
      }
    };
  }
  // 규칙이 바뀜 → 해당 범위를 지우고 새로 만듦
  if (scope === 'after') {
    // 날짜·주기가 그대로면 원래 시작일 기준으로 만들어 말일 당김 전 날짜(31일)·격주 순서를 지킴
    const keepAnchor = rule && date === orig.date && rule.freq === orig.repeat.freq;
    const list = !rule ? [{ ...edited, id: makeId(), date }]
      : keepAnchor ? makeSeries(edited, { ...rule, start: orig.repeat.start }, orig.date)
      : makeSeries(edited, { ...rule, start: date });
    return (d) => {
      d.transactions = d.transactions.filter((t) => !(t.seriesId === sid && t.date >= orig.date));
      const until = addDays(orig.date, -1); // 앞쪽 반복은 그 전날까지
      for (const t of d.transactions) if (t.seriesId === sid) t.repeat.until = until;
      d.transactions.push(...list);
    };
  }
  // 전체: 날짜를 옮긴 만큼 시작일도 옮겨 다시 만듦
  const start = addDays(orig.repeat.start, dayNum(date) - dayNum(orig.date));
  const list = rule ? makeSeries(edited, { ...rule, start }) : [{ ...edited, id: makeId(), date }];
  return (d) => {
    d.transactions = d.transactions.filter((t) => t.seriesId !== sid);
    d.transactions.push(...list);
  };
}

// 할부 수정: 이후 회차만 / 할부 전체
async function editInstallment(orig, fields, amount, date, months) {
  const scope = await askScope('할부 거래 수정', [['after', '이후 회차만'], ['all', '할부 전체']]);
  if (!scope) return null;
  const inst = orig.installment;
  const isCard = (acctById(fields.account) || {}).kind === 'card' && fields.type === 'expense';
  const structSame = isCard && amount === inst.total && months === inst.months && date === orig.date;
  if (scope === 'after' && !structSame) {
    showTxError('금액·개월 수·날짜·결제수단 종류는 할부 전체를 고를 때만 바꿀 수 있습니다.');
    return null;
  }
  if (structSame) {
    // 묶음 구조는 그대로 → 고친 항목만 반영
    return (d) => {
      for (const t of d.transactions) {
        if (!t.installment || t.installment.groupId !== inst.groupId) continue;
        if (scope === 'after' && t.installment.index < inst.index) continue;
        applyChanged(t, fields, orig, SHARED_FIELDS);
      }
    };
  }
  // 할부 전체를 다시 만듦: 첫 회차 달 = 이 회차 달에서 (회차−1)달 앞.
  // 날짜를 그대로 두었으면 묶음의 원래 날(말일 당김 전, 예: 31일)을 씀 — 당김은 날을 줄이기만 하므로 가장 큰 날
  const groupDays = state.data.transactions
    .filter((t) => t.installment && t.installment.groupId === inst.groupId).map((t) => Number(t.date.slice(8, 10)));
  const anchorDay = date === orig.date ? Math.max(...groupDays) : Number(date.slice(8, 10));
  const firstDate = `${addMonths(date.slice(0, 7), -(inst.index - 1))}-${pad(anchorDay)}`; // 말일 당김은 만들 때 함
  const list = isCard && months > 1 ? makeInstallments(fields, amount, months, firstDate, inst.groupId)
    : [{ ...fields, id: makeId(), date: addMonthsClamp(firstDate, 0), amount }];
  return (d) => {
    d.transactions = d.transactions.filter((t) => !(t.installment && t.installment.groupId === inst.groupId));
    d.transactions.push(...list);
  };
}

async function deleteTx() {
  const orig = txm.original;
  if (!orig) return;
  let mutate;
  if (orig.seriesId) {
    const scope = await askScope('반복 거래 삭제', [['one', '이 거래만'], ['after', '이후 모든 거래'], ['all', '전체 반복 거래']]);
    if (!scope) return;
    const sid = orig.seriesId;
    mutate = (d) => {
      if (scope === 'one') d.transactions = d.transactions.filter((t) => t.id !== orig.id);
      else if (scope === 'all') d.transactions = d.transactions.filter((t) => t.seriesId !== sid);
      else {
        d.transactions = d.transactions.filter((t) => !(t.seriesId === sid && t.date >= orig.date));
        const until = addDays(orig.date, -1);
        for (const t of d.transactions) if (t.seriesId === sid) t.repeat.until = until;
      }
    };
  } else if (orig.installment) {
    const scope = await askScope('할부 거래 삭제', [['after', '이후 회차만'], ['all', '할부 전체']]);
    if (!scope) return;
    const g = orig.installment.groupId, idx = orig.installment.index;
    mutate = (d) => {
      d.transactions = d.transactions.filter((t) =>
        !(t.installment && t.installment.groupId === g && (scope === 'all' || t.installment.index >= idx)));
    };
  } else {
    if (!confirm('이 거래를 삭제할까요?')) return;
    mutate = (d) => { d.transactions = d.transactions.filter((t) => t.id !== orig.id); };
  }
  closeTxModal();
  commit(mutate);
}

  const move = (ev) => {

  e.preventDefault();
});

// ---------- CSV 내보내기·가져오기 (12장) ----------
const TYPE_KO = { expense: '지출', income: '수입', transfer: '이체' };
const CSV_HEADER = ['날짜', '종류', '분류', '금액', '결제수단', '받는계좌', '메모', '장소', '사용자'];

function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

// 목록 탭에서 거른 결과 그대로 (목록과 같은 순서: 최신 날짜부터, 카드대금 자동 줄 제외)
function buildCsv() {
  const list = sortTransactions(filteredTransactions());
  const byDate = new Map();
  for (const t of list) { if (!byDate.has(t.date)) byDate.set(t.date, []); byDate.get(t.date).push(t); }
  const rows = [CSV_HEADER];
  for (const d of [...byDate.keys()].sort().reverse()) {
    for (const t of byDate.get(d)) {
      const c = t.category ? catById(t.category) : null;
      const a = acctById(t.account), to = t.to ? acctById(t.to) : null, m = t.member ? memberById(t.member) : null;
      rows.push([t.date, TYPE_KO[t.type], c ? c.name : '', t.amount, a ? a.name : '', to ? to.name : '', t.memo || '', t.place || '', m ? m.name : '']);
    }
  }
  return { text: rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n', count: rows.length - 1 };
}

$('#csvExport').addEventListener('click', () => {
  if (!state.data) return;
  const { text, count } = buildCsv();
  if (!count) { toast('내보낼 거래가 없습니다.'); return; }
  const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }); // BOM: 엑셀에서 한글 안 깨짐
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ledger-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`${count}건을 ${a.download}로 내보냈습니다.`);
});

// CSV 글 → 줄·칸 (따옴표·줄바꿈 처리)
function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim() !== ''));
}

// UTF-8로 읽고, 깨지면 EUC-KR(은행·카드사 파일)로
function decodeBytes(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('euc-kr').decode(buf); }
}

const CSV_FIELDS = { '': '(쓰지 않음)', date: '날짜', type: '종류', category: '분류', amount: '금액', in: '입금액', out: '출금액', account: '결제수단', to: '받는계좌', memo: '메모', place: '장소', member: '사용자' };
// 첫 줄 열 이름으로 맞추기 (앞에 있는 규칙이 먼저)
const CSV_GUESS = [
  ['date', /^(날짜|일자|거래일|거래일자|거래일시|이용일|이용일자|이용일시|승인일|승인일자|승인일시|date)/i],
  ['type', /^(종류|구분|거래구분|입출금구분|입출구분|type)$/i],
  ['category', /^(분류|카테고리|업종|category)$/i],
  ['in', /(입금액|입금|맡기신금액)/],
  ['out', /(출금액|출금|찾으신금액)/],
  ['amount', /(금액|amount)/i],
  ['to', /^받는계좌$/],
  ['account', /^(결제수단|카드|카드명|계좌|계좌명|account)$/i],
  ['memo', /(메모|내용|적요|가맹점|사용처|비고|memo|description)/i],
  ['place', /^(장소|place)$/i],
  ['member', /^(사용자|이용자|사용자명|member)$/i],
];
function guessMapping(header) {
  const used = new Set();
  return header.map((h) => {
    const name = h.replace(/\s|\(.*?\)/g, '');
    const hit = CSV_GUESS.find(([f, re]) => !used.has(f) && re.test(name));
    if (!hit) return '';
    used.add(hit[0]);
    return hit[0];
  });
}

// 날짜 읽기: 2026-11-06, 2026.11.06, 2026/11/6, 20261106, 26.11.06 (뒤에 시각이 붙어도 됨)
function parseCsvDate(s) {
  s = (s || '').trim();
  let m = /^(\d{4})[-./년\s]*(\d{1,2})[-./월\s]*(\d{1,2})/.exec(s) || /^(\d{4})(\d{2})(\d{2})/.exec(s);
  if (!m) { const k = /^(\d{2})[-./](\d{1,2})[-./](\d{1,2})/.exec(s); if (k) m = [k[0], '20' + k[1], k[2], k[3]]; }
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > lastDayOf(y, mo)) return null;
  return dateStr(y, mo, d);
}
// 금액 읽기: 쉼표·원·공백 무시, 부호는 따로 돌려줌
function parseCsvAmount(s) {
  const t = String(s || '').replace(/[,원\s]/g, '').replace(/^\((.*)\)$/, '-$1');
  if (!/^[-+]?\d+(\.\d+)?$/.test(t)) return null;
  return Math.round(Number(t));
}

const csvm = { header: [], data: [], map: [], rows: [], bulkAccount: '', bulkMember: '' };
const findByName = (list, name) => { const n = (name || '').trim(); return n ? list.find((x) => x.name === n) : null; };

// 줄 하나 검사: 문제 문구 또는 ''
function csvProblem(r) {
  if (!r.date) return '날짜를 읽을 수 없습니다';
  if (!r.amount) return '금액이 없습니다';
  if (r.amount > MAX_AMOUNT) return '99억 원을 넘습니다';
  const a = acctById(r.account);
  if (!a) return '결제수단을 골라 주세요';
  if (!ACCOUNT_KINDS[r.type].includes(a.kind)) return r.type === 'income' ? '수입은 카드로 받을 수 없습니다' : '이체에는 카드를 쓸 수 없습니다';
  if (r.type === 'transfer') {
    const to = acctById(r.to);
    if (!to || !ACCOUNT_KINDS.transfer.includes(to.kind)) return '받는 계좌를 골라 주세요';
    if (r.to === r.account) return '보내는 계좌와 받는 계좌가 같습니다';
  } else if (!catById(r.category)) return '분류를 골라 주세요';
  return '';
}
const otherCat = (type) => (state.data.categories.find((c) => c.type === type && c.name === '기타' && !c.hidden) || {}).id || '';

// 열 맞춤으로 미리보기 줄 만들기
function buildCsvRows() {
  const col = (f) => csvm.map.indexOf(f);
  const get = (cells, f) => (col(f) >= 0 ? (cells[col(f)] || '').trim() : '');
  const existing = new Set(state.data.transactions.map((t) => `${t.date}|${t.amount}|${(t.memo || '').trim()}`));
  csvm.rows = csvm.data.map((cells, i) => {
    let type = 'expense', amount = 0;
    const tt = get(cells, 'type');
    if (/수입|입금|income/i.test(tt)) type = 'income';
    else if (/이체|transfer/i.test(tt)) type = 'transfer';
    if (col('in') >= 0 || col('out') >= 0) {
      const inn = Math.abs(parseCsvAmount(get(cells, 'in')) || 0), out = Math.abs(parseCsvAmount(get(cells, 'out')) || 0);
      if (inn) { type = tt ? type : 'income'; amount = inn; } else { amount = out; }
    }
    if (!amount && col('amount') >= 0) amount = Math.abs(parseCsvAmount(get(cells, 'amount')) || 0);
    const catName = get(cells, 'category');
    const cat = type === 'transfer' ? null
      : state.data.categories.find((c) => c.type === type && (c.name === catName || `${c.emoji} ${c.name}` === catName));
    const acc = findByName(state.data.accounts, get(cells, 'account'));
    const to = findByName(state.data.accounts, get(cells, 'to'));
    const mem = findByName(state.data.members, get(cells, 'member'));
    const r = {
      i, type, amount, date: parseCsvDate(get(cells, 'date')),
      category: cat ? cat.id : (type === 'transfer' ? '' : otherCat(type)),
      account: acc ? acc.id : csvm.bulkAccount,
      to: to ? to.id : '',
      memo: get(cells, 'memo').slice(0, 40), place: get(cells, 'place').slice(0, 40),
      member: mem ? mem.id : csvm.bulkMember,
      accountFromFile: !!acc, memberFromFile: !!mem,
    };
    r.dup = existing.has(`${r.date}|${r.amount}|${r.memo}`); // 같은 날짜·금액·메모 → 중복 의심
    r.problem = csvProblem(r);
    r.include = !r.problem && !r.dup;
    return r;
  });
}

function renderCsvMap() {
  $('#csvMap').innerHTML = !csvm.header.length ? '' :
    `<div class="field"><span class="field-label">열 맞추기 (첫 줄 열 이름으로 맞췄습니다. 틀리면 고쳐 주세요)</span><div class="csv-map">` +
    csvm.header.map((h, i) => `<label><span class="col-name" title="${escapeHtml(h)}">${escapeHtml(h || `${i + 1}번째 열`)}</span>` +
      `<select data-col="${i}">${Object.entries(CSV_FIELDS).map(([v, t]) => `<option value="${v}"${csvm.map[i] === v ? ' selected' : ''}>${t}</option>`).join('')}</select></label>`).join('') +
    `</div></div>`;
}

function renderCsvPreview() {
  if (!csvm.header.length) { $('#csvPreview').innerHTML = ''; $('#csvCount').textContent = ''; $('#csvAdd').disabled = true; return; }
  const opt = (v, t, sel) => `<option value="${escapeHtml(v)}"${sel ? ' selected' : ''}>${escapeHtml(t)}</option>`;
  const accOpts = (kinds, sel) => opt('', '고르세요', !sel) + state.data.accounts.filter((a) => kinds.includes(a.kind) && (!a.hidden || a.id === sel)).map((a) => opt(a.id, a.name, a.id === sel)).join('');
  const memOpts = (sel) => opt('', '공동', !sel) + state.data.members.filter((m) => !m.hidden || m.id === sel).map((m) => opt(m.id, m.name, m.id === sel)).join('');
  const catOpts = (type, sel) => opt('', '고르세요', !sel) + state.data.categories.filter((c) => c.type === type && (!c.hidden || c.id === sel)).map((c) => opt(c.id, `${c.emoji || ''} ${c.name}`, c.id === sel)).join('');
  const rows = csvm.rows.map((r) => {
    const status = r.problem ? `<span class="st-bad">${escapeHtml(r.problem)}</span>` : r.dup ? '<span class="st-dup">중복 의심</span>' : '';
    const mid = r.type === 'transfer'
      ? `<td><select data-k="account" data-i="${r.i}">${accOpts(ACCOUNT_KINDS.transfer, r.account)}</select> → <select data-k="to" data-i="${r.i}">${accOpts(ACCOUNT_KINDS.transfer, r.to)}</select></td><td></td>`
      : `<td><select data-k="account" data-i="${r.i}">${accOpts(ACCOUNT_KINDS[r.type], r.account)}</select></td>` +
        `<td><select data-k="category" data-i="${r.i}">${catOpts(r.type, r.category)}</select></td>`;
    return `<tr class="${r.include ? '' : 'off'}"><td><input type="checkbox" data-k="include" data-i="${r.i}"${r.include ? ' checked' : ''}${r.problem ? ' disabled' : ''} aria-label="추가"></td>` +
      `<td>${r.date || '?'}</td><td><select data-k="type" data-i="${r.i}">${Object.entries(TYPE_KO).map(([v, t]) => opt(v, t, v === r.type)).join('')}</select></td>` +
      `<td class="amt">${r.amount ? fmt(r.amount) : '?'}</td><td class="memo" title="${escapeHtml(r.memo)}">${escapeHtml(r.memo)}</td>` +
      mid + `<td><select data-k="member" data-i="${r.i}">${memOpts(r.member)}</select></td><td>${status}</td></tr>`;
  }).join('');
  $('#csvPreview').innerHTML =
    `<div class="csv-bulk"><label>결제수단 모두 <select id="csvBulkAccount">${accOpts(['cash', 'bank', 'card'], csvm.bulkAccount)}</select></label>` +
    `<label>사용자 모두 <select id="csvBulkMember">${memOpts(csvm.bulkMember)}</select></label>` +
    `<span class="hint">파일에서 못 맞춘 줄에만 적용됩니다.</span></div>` +
    `<div class="csv-scroll"><table class="csv-table"><thead><tr><th></th><th>날짜</th><th>종류</th><th>금액</th><th>메모</th><th>결제수단</th><th>분류</th><th>사용자</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const add = csvm.rows.filter((r) => r.include && !r.problem).length;
  const dup = csvm.rows.filter((r) => r.dup).length, bad = csvm.rows.filter((r) => r.problem).length;
  $('#csvCount').textContent = `추가할 거래 ${add}건 · 중복 의심 ${dup}건 · 문제 ${bad}건`;
  $('#csvAdd').disabled = !add;
  $('#csvAdd').textContent = `${add}건 추가`;
}

function openCsvImport() {
  if (state.locked || !state.data) { toast('⚠ 불러오기 실패 상태라 편집할 수 없습니다.'); return; }
  Object.assign(csvm, { header: [], data: [], map: [], rows: [] });
  csvm.bulkAccount = (state.data.accounts.find((a) => !a.hidden) || {}).id || '';
  csvm.bulkMember = '';
  $('#csvFile').value = '';
  $('#csvError').textContent = '';
  renderCsvMap(); renderCsvPreview();
  $('#csvModal').hidden = false;
  state.modalOpen = true;
}
function closeCsvImport() { $('#csvModal').hidden = true; state.modalOpen = false; }

// 파일 글을 받아 미리보기까지 (시험에서도 이 함수를 씀)
function loadCsvText(text) {
  const rows = parseCsv(text);
  $('#csvError').textContent = '';
  if (rows.length < 2) { $('#csvError').textContent = '거래가 들어 있는 CSV가 아닙니다.'; Object.assign(csvm, { header: [], data: [] }); renderCsvMap(); renderCsvPreview(); return; }
  csvm.header = rows[0].map((h) => h.trim());
  csvm.data = rows.slice(1);
  csvm.map = guessMapping(csvm.header);
  if (!csvm.map.includes('date') || !(csvm.map.includes('amount') || csvm.map.includes('in') || csvm.map.includes('out'))) {
    $('#csvError').textContent = '날짜·금액 열을 찾지 못했습니다. 위에서 열을 골라 주세요.';
  }
  buildCsvRows(); renderCsvMap(); renderCsvPreview();
}

$('#csvImport').addEventListener('click', openCsvImport);
$('#csvCancel').addEventListener('click', closeCsvImport);
$('#csvFile').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;

});
$('#csvMap').addEventListener('change', (e) => {
  const s = e.target.closest('select[data-col]');
  if (!s) return;
  csvm.map[Number(s.dataset.col)] = s.value;
  if (s.value) csvm.map.forEach((v, j) => { if (j !== Number(s.dataset.col) && v === s.value) csvm.map[j] = ''; }); // 한 항목은 한 열에만
  const ok = csvm.map.includes('date') && (csvm.map.includes('amount') || csvm.map.includes('in') || csvm.map.includes('out'));
  $('#csvError').textContent = ok ? '' : '날짜·금액 열을 찾지 못했습니다. 위에서 열을 골라 주세요.';
  buildCsvRows(); renderCsvMap(); renderCsvPreview();
});
$('#csvPreview').addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'csvBulkAccount' || el.id === 'csvBulkMember') {
    if (el.id === 'csvBulkAccount') csvm.bulkAccount = el.value; else csvm.bulkMember = el.value;
    for (const r of csvm.rows) {
      if (el.id === 'csvBulkAccount' && !r.accountFromFile) r.account = el.value;
      if (el.id === 'csvBulkMember' && !r.memberFromFile) r.member = el.value;
      const p = r.problem; r.problem = csvProblem(r);
      if (p && !r.problem) r.include = !r.dup; // 문제가 풀리면 다시 넣기
      if (r.problem) r.include = false;
    }
    renderCsvPreview();
    return;
  }
  const r = csvm.rows[Number(el.dataset.i)];
  if (!r) return;
  const k = el.dataset.k;
  if (k === 'include') r.include = el.checked;
  else {
    r[k] = el.value;
    if (k === 'account') r.accountFromFile = true;
    if (k === 'member') r.memberFromFile = true;
    if (k === 'type') { r.category = r.type === 'transfer' ? '' : otherCat(r.type); }
    const p = r.problem; r.problem = csvProblem(r);
    if (p && !r.problem) r.include = !r.dup;
    if (r.problem) r.include = false;
  }
  renderCsvPreview();
});
// 고른 줄 추가 (기존 거래는 지우지 않음)
$('#csvAdd').addEventListener('click', () => {
  const pick = csvm.rows.filter((r) => r.include && !r.problem);
  if (!pick.length) return;
  const list = pick.map((r) => {
    const t = { id: makeId(), type: r.type, date: r.date, amount: r.amount, account: r.account, memo: r.memo };

// ---------- 통계 탭 (11장) ----------
// 기간은 상단바의 달 기준, 상단바 사용자 선택도 적용. 지출에는 이체·카드대금을 넣지 않음.
const statsState = { period: 'this', from: '', to: '' };

// 기간 [from, to]와 바로 앞 같은 길이 기간 [pFrom, pTo], 마지막 달
function statsRange() {
  const P = statsState.period;
  if (P === 'custom') {
    const from = statsState.from || dateStr(state.year, state.month, 1);
    const to = statsState.to || dateStr(state.year, state.month, lastDayOf(state.year, state.month));
    const len = dayNum(to) - dayNum(from) + 1;
    const pTo = addDays(from, -1);
    return { from, to, pFrom: addDays(pTo, -(len - 1)), pTo, endYm: to.slice(0, 7), months: 0 };
  }
  const n = P === 'this' || P === 'last' ? 1 : Number(P);
  const endYm = addMonths(monthKey(state.year, state.month), P === 'last' ? -1 : 0);
  const startYm = addMonths(endYm, -(n - 1));
  const monthEnd = (ym) => { const [y, m] = ym.split('-').map(Number); return dateStr(y, m, lastDayOf(y, m)); };
  return { from: startYm + '-01', to: monthEnd(endYm), pFrom: addMonths(startYm, -n) + '-01', pTo: monthEnd(addMonths(endYm, -n)), endYm, months: n };
}

const statTx = (type, from, to) => (state.data ? state.data.transactions : [])
  .filter((t) => t.type === type && t.date >= from && t.date <= to && memberMatch(t));
const sumBy = (list, keyFn) => {
  const m = new Map();
  for (const t of list) { const k = keyFn(t); m.set(k, (m.get(k) || 0) + t.amount); }
  return m;
};
const pctText = (part, whole) => (whole ? `${(part / whole * 100).toFixed(1)}%` : '0%');
// 마우스를 올렸을 때 글: 금액 가리기가 켜져 있으면 비율만 (14장)
function tipText(label, amount, pct) {
  return state.hideAmounts ? `${label}${pct ? ' · ' + pct : ''}` : `${label} · ${fmt(amount)}원${pct ? ' · ' + pct : ''}`;
}
// 전월(이전 기간) 대비: ▲ 늘어남 빨강, ▼ 줄어듦 파랑
function diffHtml(now, prev) {
  const d = now - prev;
  if (!d) return '<span class="hint">-</span>';
  return d > 0 ? `<span class="up">▲ ${fmt(d)}</span>` : `<span class="down">▼ ${fmt(d)}</span>`;
}
const shortWon = (v) => {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 100000000) return s + (a / 100000000).toFixed(a % 100000000 ? 1 : 0) + '억';
  if (a >= 10000) return s + Math.round(a / 10000).toLocaleString('ko-KR') + '만';
  return s + a.toLocaleString('ko-KR');
};

// ① 분류별 지출 도넛 + 표
function donutCard(r) {
  const now = statTx('expense', r.from, r.to), prev = statTx('expense', r.pFrom, r.pTo);
  const total = now.reduce((s, t) => s + t.amount, 0);
  const byCat = sumBy(now, (t) => t.category), byPrev = sumBy(prev, (t) => t.category);
  const cats = [...new Set([...byCat.keys(), ...byPrev.keys()])]
    .map((id) => ({ c: catById(id) || { name: '분류 없음', color: 'gray', emoji: '•' }, now: byCat.get(id) || 0, prev: byPrev.get(id) || 0 }))
    .sort((a, b) => b.now - a.now || b.prev - a.prev);
  const prevLabel = r.months === 1 ? '전월 대비' : '이전 대비';
  if (!total && !cats.length) return `<div class="stat-card"><h3>분류별 지출</h3><div class="stat-empty">이 기간 지출이 없습니다.</div></div>`;
  const R = 70, C = 2 * Math.PI * R;
  let off = 0, slices = '';
  for (const x of cats) {
    if (!x.now) continue;
    const len = x.now / total * C;
    slices += `<circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--c-${x.c.color}-strong)" stroke-width="34" ` +
      `stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)" ` +
      `data-tip="${escapeHtml(tipText(`${x.c.emoji || ''} ${x.c.name}`, x.now, pctText(x.now, total)))}"/>`;
    off += len;
  }
  const center = state.hideAmounts ? '•••••원' : `${fmt(total)}원`;
  const svg = `<svg viewBox="0 0 200 200" role="img" aria-label="분류별 지출">` +
    `<circle r="${R}" cx="100" cy="100" fill="none" stroke="#f0f1f5" stroke-width="34"/>${slices}` +
    `<text x="100" y="96" text-anchor="middle" font-size="11" fill="var(--muted)">지출</text>` +
    `<text x="100" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">${center}</text></svg>`;
  const rows = cats.map((x) =>
    `<tr><td><span class="dot" style="background:var(--c-${x.c.color}-strong)"></span>${escapeHtml(`${x.c.emoji || ''} ${x.c.name}`)}</td>` +
    `<td>${fmt(x.now)}</td><td>${pctText(x.now, total)}</td><td>${diffHtml(x.now, x.prev)}</td></tr>`).join('');
  return `<div class="stat-card wide"><h3>분류별 지출</h3><div class="donut-wrap">${svg}` +
    `<table class="stat-table"><thead><tr><th>분류</th><th>금액</th><th>비율</th><th>${prevLabel}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

// ② 최근 12개월 수입·지출 막대와 합계(수입−지출) 선
function monthlyCard(r) {
  const months = Array.from({ length: 12 }, (_, i) => addMonths(r.endYm, i - 11));
  const data = months.map((ym) => {
    const [y, m] = ym.split('-').map(Number);
    const to = dateStr(y, m, lastDayOf(y, m));
    const inc = statTx('income', ym + '-01', to).reduce((s, t) => s + t.amount, 0);
    const exp = statTx('expense', ym + '-01', to).reduce((s, t) => s + t.amount, 0);
    return { ym, m, inc, exp, net: inc - exp };
  });
  const W = 640, H = 240, L = 52, Rr = 10, T = 12, B = 28;
  // 눈금: 1·2·5 단위로 딱 떨어지게
  const rawMax = Math.max(1, ...data.map((d) => Math.max(d.inc, d.exp, d.net)));
  const rawMin = Math.min(0, ...data.map((d) => d.net));
  const rough = (rawMax - rawMin) / 4, mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const tick = [1, 2, 5, 10].map((k) => k * mag).find((s) => s >= rough);
  const max = Math.ceil(rawMax / tick) * tick, min = Math.floor(rawMin / tick) * tick;
  const y = (v) => T + (max - v) / (max - min) * (H - T - B);
  const step = (W - L - Rr) / 12, bw = Math.min(16, step / 3);
  let g = '';
  for (let v = min; v <= max + tick / 2; v += tick) {
    g += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f4"/>` +
      `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${state.hideAmounts ? '' : shortWon(v)}</text>`;
  }
  g += `<line x1="${L}" x2="${W - Rr}" y1="${y(0)}" y2="${y(0)}" stroke="#c5cad6"/>`;
  let pts = '';
  data.forEach((d, i) => {
    const cx = L + step * i + step / 2;
    const label = `${d.ym.slice(0, 4)}년 ${d.m}월`;
    g += `<rect x="${cx - bw - 1}" y="${y(d.inc)}" width="${bw}" height="${Math.max(0, y(0) - y(d.inc))}" fill="var(--income)" rx="2" data-tip="${escapeHtml(tipText(label + ' 수입', d.inc))}"/>`;
    g += `<rect x="${cx + 1}" y="${y(d.exp)}" width="${bw}" height="${Math.max(0, y(0) - y(d.exp))}" fill="var(--expense)" rx="2" data-tip="${escapeHtml(tipText(label + ' 지출', d.exp))}"/>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.m}월</text>`;
    pts += `${cx},${y(d.net)} `;
  });
  g += `<polyline points="${pts.trim()}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  data.forEach((d, i) => {
    const cx = L + step * i + step / 2;
    const net = state.hideAmounts ? `${d.ym.slice(0, 4)}년 ${d.m}월 합계` : `${d.ym.slice(0, 4)}년 ${d.m}월 합계 · ${d.net < 0 ? '-' : '+'}${fmt(d.net)}원`;
    g += `<circle cx="${cx}" cy="${y(d.net)}" r="4" fill="#fff" stroke="var(--accent)" stroke-width="2" data-tip="${escapeHtml(net)}"/>`;
  });
  return `<div class="stat-card wide"><h3>최근 12개월 수입·지출<span class="sub">${monthLabel(months[0])} ~ ${monthLabel(r.endYm)}</span></h3>` +
    `<div class="chart-legend"><span><i style="background:var(--income)"></i>수입</span><span><i style="background:var(--expense)"></i>지출</span>` +
    `<span><i style="background:var(--accent);height:3px;vertical-align:3px"></i>합계(수입−지출)</span></div>` +
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 12개월 수입 지출">${g}</svg></div>`;
}

// 가로 막대 줄 (③·⑤)
function hbarRow(name, amount, total, color, extra = '') {
  const pct = pctText(amount, total);
  return `<div class="hbar-row" data-tip="${escapeHtml(tipText(name, amount, pct))}"><span class="name">${escapeHtml(name)}</span>` +
    `<div class="hbar"><span style="width:${total ? (amount / total * 100).toFixed(1) : 0}%;background:${color}"></span></div>` +
    `<span class="val">${state.hideAmounts ? '' : fmt(amount) + '원'}<small>${pct}</small>${extra}</span></div>`;
}

// ③ 결제수단별 지출
function accountCard(r) {
  const now = statTx('expense', r.from, r.to);
  const total = now.reduce((s, t) => s + t.amount, 0);
  const by = [...sumBy(now, (t) => t.account)].sort((a, b) => b[1] - a[1]);
  const rows = by.map(([id, v]) => { const a = acctById(id) || { name: '?', color: 'gray' }; return hbarRow(a.name, v, total, `var(--c-${a.color || 'gray'}-strong)`); }).join('');
  return `<div class="stat-card"><h3>결제수단별 지출</h3>${rows || '<div class="stat-empty">이 기간 지출이 없습니다.</div>'}</div>`;
}

// ④ 요일별·하루 평균 지출: 기간 첫날부터 오늘(끝났으면 마지막 날)까지
function weekdayCard(r) {
  const today = todayStr();
  const end = r.to < today ? r.to : (r.from <= today ? today : r.to);
  const list = statTx('expense', r.from, end);
  const total = list.reduce((s, t) => s + t.amount, 0);
  const days = dayNum(end) - dayNum(r.from) + 1;
  const count = [0, 0, 0, 0, 0, 0, 0], sum = [0, 0, 0, 0, 0, 0, 0];
  for (let d = r.from; d <= end; d = addDays(d, 1)) count[parseDate(d).getDay()]++;
  for (const t of list) sum[parseDate(t.date).getDay()] += t.amount;
  const avg = sum.map((s, i) => (count[i] ? Math.round(s / count[i]) : 0));
  const W = 360, H = 170, T = 10, B = 24, max = Math.max(1, ...avg);
  const step = W / 7, bw = step * 0.55;
  let g = '';
  avg.forEach((v, i) => {
    const h = v / max * (H - T - B), x = step * i + (step - bw) / 2;
    const color = i === 0 ? '#e5484d' : i === 6 ? '#3e63dd' : 'var(--accent)';
    g += `<rect x="${x}" y="${H - B - h}" width="${bw}" height="${h}" rx="3" fill="${color}" opacity=".85" ` +
      `data-tip="${escapeHtml(tipText(`${WEEKDAYS[i]}요일 하루 평균`, v, '') + (state.hideAmounts ? '' : ` (합계 ${fmt(sum[i])}원 · ${count[i]}일)`))}"/>`;
    g += `<text x="${step * i + step / 2}" y="${H - 7}" text-anchor="middle" font-size="11" fill="${i === 0 ? '#e5484d' : i === 6 ? '#3e63dd' : 'var(--muted)'}">${WEEKDAYS[i]}</text>`;
  });
  const dayAvg = days > 0 ? Math.round(total / days) : 0;
  return `<div class="stat-card"><h3>요일별·하루 평균 지출</h3>` +
    `<div class="stat-big">${state.hideAmounts ? '•••••원' : fmt(dayAvg) + '원'}<small>하루 평균 (${days}일)</small></div>` +
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="요일별 하루 평균 지출">${g}</svg></div>`;
}

// ⑤ 사용자별 지출 (18장)
function memberCard(r) {
  const now = statTx('expense', r.from, r.to), prev = statTx('expense', r.pFrom, r.pTo);
  const total = now.reduce((s, t) => s + t.amount, 0);
  const key = (t) => (t.member && memberById(t.member) ? t.member : '');
  const by = sumBy(now, key), byPrev = sumBy(prev, key);
  const ids = [...new Set([...by.keys(), ...byPrev.keys()])].sort((a, b) => (by.get(b) || 0) - (by.get(a) || 0));
  const rows = ids.map((id) => {
    const m = id ? memberById(id) : { name: '공동', color: 'gray' };
    const v = by.get(id) || 0;
    let extra = `<small>${diffHtml(v, byPrev.get(id) || 0)}</small>`;
    if (id && r.months === 1) {
      const b = budgetFor(r.endYm, id, '');
      if (b != null) extra += `<small class="${v > b ? 'over-text' : ''}">예산의 ${Math.floor(v / b * 100)}%</small>`;
    }
    return hbarRow(m.name, v, total, `var(--c-${m.color || 'gray'}-strong)`, extra);
  }).join('');
  return `<div class="stat-card"><h3>사용자별 지출</h3>${rows || '<div class="stat-empty">이 기간 지출이 없습니다.</div>'}</div>`;
}

// ---------- 예산 (8장, 18장) ----------
// 예산 값: 그 달에 따로 정한 칸 → 없으면 기본값 (칸마다). memberId ''=가족 전체, catId ''=월 전체. 없으면 null
function budgetFor(ym, memberId, catId) {
  const B = (state.data && state.data.budgets) || {};
  const scope = (o) => (!o ? {} : memberId ? (o.byMember && o.byMember[memberId]) || {} : o);
  const get = (o) => (catId ? (o.byCategory || {})[catId] : o.total);
  for (const o of [scope(B[ym]), scope(B.default)]) {
    const v = get(o);
    if (typeof v === 'number' && v > 0) return v;
  }
  return null;
}
// 그 달 지출 합계 (지출만, 카드 사용·할부 회차 포함, 이체·카드대금 제외)
function spendFor(ym, memberId, catId) {
  let s = 0;
  for (const t of state.data.transactions) {
    if (t.type !== 'expense' || !t.date.startsWith(ym + '-')) continue;
    if (memberId && t.member !== memberId) continue;
    if (catId && t.category !== catId) continue;
    s += t.amount;
  }
  return s;
}
// 사용률 막대 한 줄 (80% 이상 주황, 100% 이상 빨강과 n원 초과, 예산이 없으면 사용액만)
function budgetRowHtml(label, used, budget, cls = '') {
  if (budget == null) {
    return `<div class="b-row ${cls}"><div class="b-top"><span class="label">${escapeHtml(label)}</span><span class="nums">${fmt(used)}원</span></div></div>`;
  }
  const pct = used / budget;
  const level = pct >= 1 ? 'over' : pct >= 0.8 ? 'warn' : '';
  const tail = pct >= 1 ? ` · <span class="over-text">${fmt(used - budget)}원 초과</span>` : ` · ${Math.floor(pct * 100)}%`;
  return `<div class="b-row ${cls}"><div class="b-top"><span class="label">${escapeHtml(label)}</span>` +
    `<span class="nums">${fmt(used)} / ${fmt(budget)}원${tail}</span></div>` +
    `<div class="b-bar"><span class="${level}" style="width:${Math.min(100, pct * 100).toFixed(1)}%"></span></div></div>`;
}

// 사이드바 맨 위 예산: 상단바의 달, 상단바에서 고른 사용자 (공동·전체면 가족 전체)
function renderBudgetBar() {
  const box = $('#sideBudget');
  if (!state.data) { box.innerHTML = ''; return; }
  const ym = monthKey(state.year, state.month);
  const mid = state.member && state.member !== MEMBER_SHARED && memberById(state.member) ? state.member : '';
  const who = mid ? memberById(mid).name + ' ' : '';
  let html = `<div class="b-main" id="budgetToggle" title="눌러서 ${state.budgetOpen ? '접기' : '펼치기'}">` +
    budgetRowHtml(`${state.budgetOpen ? '▾' : '▸'} ${state.month}월 ${who}예산`, spendFor(ym, mid, ''), budgetFor(ym, mid, '')) + '</div>';
  if (state.budgetOpen) {
    let rows = '';
    for (const c of state.data.categories) {
      if (c.type !== 'expense') continue;
      const b = budgetFor(ym, mid, c.id), u = spendFor(ym, mid, c.id);
      if (b == null && !u) continue;
      rows += budgetRowHtml(`${c.emoji || ''} ${c.name}`, u, b);
    }
    let people = '';
    if (!mid) {
      for (const m of state.data.members) {
        const b = budgetFor(ym, m.id, ''), u = spendFor(ym, m.id, '');
        if (b == null && !u) continue;
        people += budgetRowHtml(m.name, u, b);
      }
    }
    html += `<div class="b-detail">${rows ? '<div class="b-section">분류별</div>' + rows : '<div class="hint">이 달 지출이 없습니다.</div>'}` +
      (people ? '<div class="b-section">사용자별</div>' + people : '') + '</div>';
  }
  box.innerHTML = html;
}
$('#sideBudget').addEventListener('click', (e) => {
  if (!e.target.closest('#budgetToggle')) return;
  state.budgetOpen = !state.budgetOpen;
  renderBudgetBar();
});

// 저장한 지출로 예산을 넘었는지 → 알림 문구 목록
function overBudgetMessages(touched) {
  const msgs = [];
  const seen = new Set();
  const check = (key, label, ym, mid, cid) => {
    if (seen.has(key)) return;
    seen.add(key);
    const b = budgetFor(ym, mid, cid);
    if (b == null) return;
    const u = spendFor(ym, mid, cid);
    if (u > b) msgs.push(`⚠ ${label} 예산 ${fmt(b)}원을 ${fmt(u - b)}원 넘었습니다.`);
  };
  for (const t of touched) {
    const ym = t.date.slice(0, 7), mo = Number(ym.slice(5));
    const c = catById(t.category), m = t.member && memberById(t.member);
    if (c) check(`${ym}|c|${c.id}`, c.name, ym, '', c.id);
    check(`${ym}|t`, `${mo}월`, ym, '', '');
    if (m) {
      check(`${ym}|m|${m.id}`, m.name, ym, m.id, '');
      if (c) check(`${ym}|mc|${m.id}|${c.id}`, `${m.name} ${c.name}`, ym, m.id, c.id);
    }
  }
  return msgs;
}

// ---------- ⚙ 설정: 가족 구성원 · 계좌·카드 (18장, 14장 일부) ----------
const COLOR_NAMES = { red: '빨강', orange: '주황', yellow: '노랑', green: '초록', teal: '청록', blue: '파랑', purple: '보라', pink: '분홍', gray: '회색', lavender: '연보라' };
const setm = { tab: 'categories', editing: false, id: null, color: 'blue' };

const memberUse = (id) => state.data.transactions.filter((t) => t.member === id).length;
const accountUse = (id) =>
  state.data.transactions.filter((t) => t.account === id || t.to === id).length +
  state.data.accounts.filter((a) => a.card && a.card.payFrom === id).length;

function openSettings() {
  if (state.locked || !state.data) { toast('⚠ 불러오기 실패 상태라 편집할 수 없습니다.'); return; }
  setm.editing = false; setm.id = null;

}
function closeSettings() {
  $('#setModal').hidden = true;
  if (setm.quick) {

    setm.tab = setm.quick.prevTab;

// ---------- 거래 입력창의 '+ 추가' (분류·결제수단·사용자): 설정과 같은 입력 칸을 작은 창으로 ----------
const QUICK_TITLE = { categories: '분류 추가', accounts: '결제수단 추가', members: '사용자 추가' };
function openQuickAdd(kind, target = '') {
  setm.quick = { kind, target, prevTab: setm.tab };
  setm.tab = kind;
  setm.editing = true; setm.id = null;
  setm.color = kind === 'members' ? 'blue' : kind === 'categories' ? 'orange' : 'green';

// 저장하면 거래 입력창에서 바로 그 항목을 고름
function finishQuickAdd(id) {
  const { kind, target } = setm.quick;
  closeSettings();

  else if (kind === 'members') { txm.member = id; renderMemberPick(); refillAccounts(); }
  else if (kind === 'accounts') {
    const o = txm.original || {};

      const from = $('#txFrom').value, to = $('#txTo').value;
      fillSelect($('#txFrom'), list, target === 'from' ? id : from, true);
      fillSelect($('#txTo'), list, target === 'from' ? to : id);
    } else {
      fillSelect($('#txAccount'), accountsFor(txm.type, [o.account]), id, true);

  showTxError('');
}

function membersPanelHtml() {

  if (setm.editing) {
    const m = setm.id ? memberById(setm.id) : { name: '', hidden: false };
    editor = `<div class="set-editor">` +
      `<div class="set-editor-title">${setm.id ? '구성원 수정' : '구성원 추가'}</div>` +
      `<label class="field"><span class="field-label">이름</span><input type="text" id="seName" maxlength="10" autocomplete="off" value="${escapeHtml(m.name)}"></label>` +
      `<div class="field"><span class="field-label">색</span><div class="swatches">${swatchesHtml()}</div></div>` +
      hiddenCheckHtml(m.hidden, '거래 입력창·상단 사용자 선택에 안 보임, 옛 거래 표시는 그대로') +
      `<p class="form-error" id="seError"></p>` +
      `<div class="editor-btns">${setm.id ? '<button type="button" class="danger-btn" data-action="delete-member">삭제</button>' : ''}` +
      `<div class="spacer"></div><button type="button" class="text-btn" data-action="cancel">취소</button>` +
      `<button type="button" class="primary-btn" data-action="save-member">저장</button></div></div>`;
  }
  return `<div class="set-list">${rows || '<div class="side-empty">구성원이 없습니다. 모든 거래가 공동으로 기록됩니다.</div>'}</div>` +
    (setm.editing ? editor : '<button type="button" class="text-btn set-add" data-action="new">+ 구성원 추가</button>');
}

function accountsPanelHtml() {
  const list = state.data.accounts;
  const rows = list.map((a, i) => {
    const who = a.members && a.members.length
      ? a.members.map((id) => memberById(id)).filter(Boolean).map((m) => m.name).join('·') : '모두';
    // 분류처럼 ▲▼로 순서 바꾸기 — 이 순서가 사이드바·결제수단 목록·거르기에 그대로 쓰임
    return `<div class="set-row cat-row${setm.editing && setm.id === a.id ? ' editing' : ''}">` +
      `<button type="button" class="cat-row-main" data-action="edit" data-id="${escapeHtml(a.id)}">` +
      `<span class="acct-dot" style="background:var(--c-${a.color || 'gray'}-strong)"></span>` +
      `<span class="name">${escapeHtml(a.name)}<span class="sub">${KIND_LABEL[a.kind] || ''}${a.hidden ? ' (숨김)' : ''}</span></span>` +
      `<span class="sub">쓰는 사람: ${escapeHtml(who)}</span></button>` +
      `<button type="button" class="text-btn order-btn" data-action="acct-up" data-id="${escapeHtml(a.id)}" title="위로"${i === 0 ? ' disabled' : ''}>▲</button>` +
      `<button type="button" class="text-btn order-btn" data-action="acct-down" data-id="${escapeHtml(a.id)}" title="아래로"${i === list.length - 1 ? ' disabled' : ''}>▼</button></div>`;
  }).join('');
  let editor = '';
  if (setm.editing) {
    const a = setm.id ? acctById(setm.id) : { name: '', kind: 'bank', opening: 0, members: [], hidden: false };
    const used = setm.id ? accountUse(setm.id) > 0 : false;
    const card = a.card || { cutoffDay: 31, paymentDay: 14, payFrom: '' };
    const banks = state.data.accounts.filter((x) => x.kind === 'bank' && x.id !== a.id && (!x.hidden || x.id === card.payFrom));
    const members = state.data.members.filter((m) => !m.hidden || (a.members || []).includes(m.id));
    const opt = (v, t, sel) => `<option value="${v}"${sel ? ' selected' : ''}>${t}</option>`;
    const days = (sel, withLast) => Array.from({ length: 28 }, (_, i) => opt(i + 1, `${i + 1}일`, sel === i + 1)).join('') + (withLast ? opt(31, '말일', sel === 31) : '');
    editor = `<div class="set-editor">` +
      `<div class="set-editor-title">${setm.id ? '계좌·카드 수정' : '계좌·카드 추가'}</div>` +
      `<label class="field"><span class="field-label">이름</span><input type="text" id="seName" maxlength="20" autocomplete="off" value="${escapeHtml(a.name)}"></label>` +
      `<label class="field"><span class="field-label">종류${used ? ' (거래가 있어 바꿀 수 없음)' : ''}</span><select id="seKind"${used ? ' disabled' : ''}>` +
      opt('cash', '현금', a.kind === 'cash') + opt('bank', '통장', a.kind === 'bank') + opt('card', '카드', a.kind === 'card') + `</select></label>` +
      `<label class="field"><span class="field-label" id="seOpeningLabel">${a.kind === 'card' ? '처음 미결제 금액' : '시작 잔액'}</span>` +
      `<span class="amount-wrap"><input type="text" id="seOpening" class="opening-input num" inputmode="numeric" autocomplete="off" placeholder="0" value="${a.opening ? fmtNum(a.opening) : ''}" data-last="${a.opening ? fmtNum(a.opening) : ''}"><span class="amount-unit">원</span></span>` +
      `<span class="hint" id="seOpeningHint"${a.kind === 'card' ? '' : ' hidden'}>등록한 날 뒤의 첫 결제일에 출금 통장에서 빠집니다.</span></label>` +
      `<div class="field"><span class="field-label">색</span><div class="swatches">${swatchesHtml()}</div></div>` +
      `<div class="field"><span class="field-label">쓰는 사람</span><div class="member-checks">` +
      (members.length ? members.map((m) => `<label class="check-line"><input type="checkbox" class="seMember" value="${escapeHtml(m.id)}"${(a.members || []).includes(m.id) ? ' checked' : ''}> ${escapeHtml(m.name)}</label>`).join('') : '<span class="hint">등록된 구성원이 없습니다.</span>') +
      `</div><span class="hint">아무도 체크하지 않으면 모두가 쓰는 결제수단입니다.</span></div>` +
      `<div class="card-fields" id="seCard"${a.kind === 'card' ? '' : ' hidden'}>` +
      `<label class="field"><span class="field-label">마감일</span><select id="seCutoff">${days(card.cutoffDay, true)}</select></label>` +
      `<label class="field"><span class="field-label">결제일</span><select id="sePayDay">${days(card.paymentDay, false)}</select></label>` +
      `<label class="field"><span class="field-label">출금 통장</span><select id="sePayFrom">` +
      (banks.length ? banks.map((b) => opt(escapeHtml(b.id), escapeHtml(b.name), b.id === card.payFrom)).join('') : opt('', '등록된 통장 없음', true)) +
      `</select></label></div>` +
      hiddenCheckHtml(a.hidden, '거래 입력창에 안 보임, 옛 거래 표시는 그대로') +
      `<p class="form-error" id="seError"></p>` +
      `<div class="editor-btns">${setm.id ? '<button type="button" class="danger-btn" data-action="delete-account">삭제</button>' : ''}` +
      `<div class="spacer"></div><button type="button" class="text-btn" data-action="cancel">취소</button>` +
      `<button type="button" class="primary-btn" data-action="save-account">저장</button></div></div>`;
  }
  return `<div class="set-list">${rows}</div>` +
    (setm.editing ? editor : '<button type="button" class="text-btn set-add" data-action="new">+ 계좌·카드 추가</button>');
}

function renderSettings() {
  if ($('#setModal').hidden || !state.data) return;
  document.querySelectorAll('.set-tab').forEach((b) => b.classList.toggle('active', b.dataset.set === setm.tab));
  $('#setTitle').textContent = setm.quick ? QUICK_TITLE[setm.quick.kind] : '⚙ 설정';
  $('#setBody').innerHTML = setm.tab === 'members' ? membersPanelHtml()
    : setm.tab === 'categories' ? categoriesPanelHtml()
    : setm.tab === 'accounts' ? accountsPanelHtml() : budgetPanelHtml();
  const name = $('#seName');
  if (name) name.focus();
  // 예산 입력 칸 금액 쉼표
  document.querySelectorAll('.b-input').forEach((el) => { el.dataset.last = el.value; });
  // 거래 입력창에서 연 결제수단 추가: 수입·이체에서는 카드를 만들 수 없음 (그 칸에서 고를 수 없으므로)
  if (setm.quick && setm.quick.kind === 'accounts' && txm.type !== 'expense') {
    const card = document.querySelector('#seKind option[value="card"]');
    if (card) card.remove();
  }
}

function saveMember() {
  const name = $('#seName').value.trim();
  if (!name) { $('#seError').textContent = '이름을 입력해 주세요.'; return; }
  const m = setm.id ? clone(memberById(setm.id)) : { id: makeId() };
  m.name = name; m.color = setm.color;
  if (hiddenChecked()) m.hidden = true; else delete m.hidden;
  const id = setm.id;
  setm.editing = false; setm.id = null;
  commit((d) => {
    const i = d.members.findIndex((x) => x.id === m.id);
    if (i >= 0) d.members[i] = m; else d.members.push(m);
  });
  if (!id) toast(`${name} 님을 추가했습니다.`);
  if (!id && setm.quick) finishQuickAdd(m.id);
}

function deleteMember() {
  const id = setm.id;
  if (memberUse(id) > 0) { $('#seError').textContent = '거래에 쓰인 사용자는 지울 수 없습니다. 숨김을 쓰세요.'; return; }
  if (!confirm('이 구성원을 삭제할까요?')) return;
  setm.editing = false; setm.id = null;
  if (state.member === id) state.member = '';
  commit((d) => {
    d.members = d.members.filter((m) => m.id !== id);
    for (const a of d.accounts) if (a.members) a.members = a.members.filter((x) => x !== id); // 쓰는 사람에서도 빼기
  });
}

function saveAccount() {
  const err = (msg) => { $('#seError').textContent = msg; };
  const name = $('#seName').value.trim();
  if (!name) return err('이름을 입력해 주세요.');
  const old = setm.id ? acctById(setm.id) : null;
  const kind = $('#seKind').disabled && old ? old.kind : $('#seKind').value;
  const a = old ? clone(old) : { id: makeId() };
  a.name = name;
  a.kind = kind;
  a.opening = Number($('#seOpening').value.replace(/,/g, '')) || 0;
  a.color = setm.color;
  a.members = [...document.querySelectorAll('.seMember:checked')].map((c) => c.value);
  if (hiddenChecked()) a.hidden = true; else delete a.hidden;
  if (kind === 'card') {
    const payFrom = $('#sePayFrom').value;
    if (!payFrom) return err('출금 통장으로 쓸 통장을 먼저 등록해 주세요.');
    a.card = { cutoffDay: Number($('#seCutoff').value), paymentDay: Number($('#sePayDay').value), payFrom };
    // 처음 미결제 금액: 새 카드이거나 금액·종류가 바뀌면 오늘을 등록일로 (9장)
    if (!old || old.kind !== 'card' || old.opening !== a.opening || !old.openingDate) a.openingDate = todayStr();
  } else { delete a.card; delete a.openingDate; }
  setm.editing = false; setm.id = null;
  commit((d) => {
    const i = d.accounts.findIndex((x) => x.id === a.id);
    if (i >= 0) d.accounts[i] = a; else d.accounts.push(a);
  });
  if (!old && setm.quick) finishQuickAdd(a.id);
}

function deleteAccount() {
  const id = setm.id;
  if (accountUse(id) > 0) { $('#seError').textContent = '거래나 카드 출금 통장에 쓰인 계좌는 지울 수 없습니다. 숨김을 쓰세요.'; return; }
  if (!confirm('이 계좌·카드를 삭제할까요?')) return;
  setm.editing = false; setm.id = null;
  if (state.list.account === id) state.list.account = '';
  commit((d) => { d.accounts = d.accounts.filter((a) => a.id !== id); });
}

$('#setBody').addEventListener('click', (e) => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const act = b.dataset.action;
  if (act === 'edit' || act === 'new') {
    setm.editing = true;
    setm.id = act === 'edit' ? b.dataset.id : null;
    const find = setm.tab === 'members' ? memberById : setm.tab === 'categories' ? catById : acctById;
    const item = setm.id ? find(setm.id) : null;
    setm.color = item ? item.color || 'gray' : (setm.tab === 'members' ? 'blue' : setm.tab === 'categories' ? 'orange' : 'green');
    setm.newType = b.dataset.type || 'expense';
    renderSettings();
  } else if (act === 'cancel') {
    if (setm.quick) { closeSettings(); return; } // '+ 추가' 창은 취소하면 닫힘
    setm.editing = false; setm.id = null; renderSettings();
  }
  else if (act === 'color') {
    setm.color = b.dataset.color;
    document.querySelectorAll('.swatch').forEach((s) => s.classList.toggle('selected', s.dataset.color === setm.color));
  }
  else if (act === 'save-member') saveMember();
  else if (act === 'delete-member') deleteMember();
  else if (act === 'save-account') saveAccount();
  else if (act === 'delete-account') deleteAccount();
  else if (act === 'acct-up' || act === 'acct-down') moveAccount(b.dataset.id, act === 'acct-up' ? -1 : 1);
});

// 계좌·카드 순서: 바로 위·아래 계좌와 자리 바꾸기 (종류와 상관없이 전체 목록에서)
function moveAccount(id, dir) {
  commit((d) => {
    const i = d.accounts.findIndex((a) => a.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= d.accounts.length) return;
    [d.accounts[i], d.accounts[j]] = [d.accounts[j], d.accounts[i]];
  });
}
// ---------- ⚙ 설정 > 분류 관리 (14장): 추가·이름·색·이모티콘·숨김·순서 ----------
const categoryUse = (id) => state.data.transactions.filter((t) => t.category === id).length;
// 이모티콘은 첫 글자(그림 하나)만
function firstGrapheme(s) {
  s = (s || '').trim();
  if (!s) return '';
  try { return [...new Intl.Segmenter('ko', { granularity: 'grapheme' }).segment(s)][0].segment; } catch { return [...s][0]; }
}

function categoriesPanelHtml() {
  const group = (type, label) => {
    const list = state.data.categories.filter((c) => c.type === type);
    const rows = list.map((c, i) =>
      `<div class="set-row cat-row${setm.editing && setm.id === c.id ? ' editing' : ''}">` +
      `<button type="button" class="cat-row-main" data-action="edit" data-id="${escapeHtml(c.id)}">` +
      `<span class="cat-chip" style="background:var(--c-${c.color || 'gray'}-bg)">${escapeHtml(c.emoji || '•')}</span>` +
      `<span class="name">${escapeHtml(c.name)}${c.hidden ? '<span class="sub">(숨김)</span>' : ''}</span>` +
      `<span class="sub">거래 ${categoryUse(c.id)}건</span></button>` +
      `<button type="button" class="text-btn order-btn" data-action="up" data-id="${escapeHtml(c.id)}" title="위로"${i === 0 ? ' disabled' : ''}>▲</button>` +
      `<button type="button" class="text-btn order-btn" data-action="down" data-id="${escapeHtml(c.id)}" title="아래로"${i === list.length - 1 ? ' disabled' : ''}>▼</button></div>`).join('');
    return `<div class="field cat-group"><span class="field-label">${label}</span><div class="set-list">${rows}</div>` +
      (setm.editing ? '' : `<button type="button" class="text-btn set-add" data-action="new" data-type="${type}">+ ${label} 분류 추가</button>`) + `</div>`;
  };
  let editor = '';
  if (setm.editing) {
    const c = setm.id ? catById(setm.id) : { name: '', emoji: '', type: setm.newType, hidden: false };
    editor = `<div class="set-editor">` +
      `<div class="set-editor-title">${setm.id ? '분류 수정' : `${c.type === 'income' ? '수입' : '지출'} 분류 추가`}</div>` +
      `<div class="b-grid" style="grid-template-columns: 1fr 90px"><label class="field"><span class="field-label">이름</span>` +
      `<input type="text" id="seName" maxlength="10" autocomplete="off" value="${escapeHtml(c.name)}"></label>` +
      `<label class="field"><span class="field-label">이모티콘</span><input type="text" id="seEmoji" autocomplete="off" value="${escapeHtml(c.emoji || '')}" style="text-align:center;font-size:18px"></label></div>` +
      `<div class="field"><span class="field-label">색</span><div class="swatches">${swatchesHtml()}</div></div>` +
      hiddenCheckHtml(c.hidden, '거래 입력창에 안 보임, 옛 거래 표시는 그대로') +
      `<p class="form-error" id="seError"></p>` +
      `<div class="editor-btns">${setm.id ? '<button type="button" class="danger-btn" data-action="delete-category">삭제</button>' : ''}` +
      `<div class="spacer"></div><button type="button" class="text-btn" data-action="cancel">취소</button>` +
      `<button type="button" class="primary-btn" data-action="save-category">저장</button></div></div>`;
  }
  return editor + group('expense', '지출') + group('income', '수입');
}

function saveCategory() {
  const err = (m) => { $('#seError').textContent = m; };
  const name = $('#seName').value.trim();
  if (!name) return err('이름을 입력해 주세요.');
  const old = setm.id ? catById(setm.id) : null;
  const type = old ? old.type : setm.newType;
  if (state.data.categories.some((c) => c.type === type && c.name === name && c.id !== setm.id)) return err('같은 이름의 분류가 있습니다.');
  const emoji = firstGrapheme($('#seEmoji').value);
  if (!emoji) return err('이모티콘을 넣어 주세요.');
  const c = old ? clone(old) : { id: makeId(), type };
  Object.assign(c, { name, emoji, color: setm.color });
  if (hiddenChecked()) c.hidden = true; else delete c.hidden;
  setm.editing = false; setm.id = null;
  commit((d) => {
    const i = d.categories.findIndex((x) => x.id === c.id);
    if (i >= 0) d.categories[i] = c;
    else {
      // 같은 종류의 마지막 분류 뒤에 넣기
      let last = -1;
      d.categories.forEach((x, j) => { if (x.type === type) last = j; });
      d.categories.splice(last + 1, 0, c);
    }
  });
  if (!old && setm.quick) finishQuickAdd(c.id);
}

function deleteCategory() {
  const id = setm.id;
  if (categoryUse(id) > 0) { $('#seError').textContent = '거래에 쓰인 분류는 지울 수 없습니다. 숨김을 쓰세요.'; return; }
  if (!confirm('이 분류를 삭제할까요?')) return;
  setm.editing = false; setm.id = null;
  if (state.list.category === id) state.list.category = '';
  commit((d) => {
    d.categories = d.categories.filter((c) => c.id !== id);
    // 예산에서도 빼기
    for (const b of Object.values(d.budgets || {})) {
      if (b.byCategory) delete b.byCategory[id];
      for (const mb of Object.values(b.byMember || {})) if (mb.byCategory) delete mb.byCategory[id];
    }
  });
}

// 순서: 같은 종류 안에서 위·아래 분류와 자리 바꾸기
function moveCategory(id, dir) {
  commit((d) => {
    const i = d.categories.findIndex((c) => c.id === id);
    if (i < 0) return;
    const type = d.categories[i].type;
    let j = i + dir;
    while (j >= 0 && j < d.categories.length && d.categories[j].type !== type) j += dir;
    if (j < 0 || j >= d.categories.length) return;
    [d.categories[i], d.categories[j]] = [d.categories[j], d.categories[i]];
  });
}

$('#setBody').addEventListener('click', (e) => {
  const b = e.target.closest('[data-action]');
  if (!b || setm.tab !== 'categories') return;
  const act = b.dataset.action;
  if (act === 'save-category') saveCategory();
  else if (act === 'delete-category') deleteCategory();
  else if (act === 'up' || act === 'down') moveCategory(b.dataset.id, act === 'up' ? -1 : 1);
});

// 배치 초기화: 사이드바 너비·띄우기를 처음으로
$('#layoutReset').addEventListener('click', () => {
  Object.assign(layout, { width: 360, floating: false, x: null, y: null });
  try { localStorage.removeItem(LAYOUT_KEY); } catch {}
  renderSidebar();
  toast('사이드바 배치를 처음 상태로 되돌렸습니다.');
});

// ---------- ⚙ 설정 > 예산 (8장, 18장) ----------
// setm.bMonth: 'default'(매달 기본값) 또는 'YYYY-MM', setm.bScope: ''(가족 전체) 또는 사용자 id
setm.bMonth = 'default';
setm.bScope = '';
const monthLabel = (ym) => `${ym.slice(0, 4)}년 ${Number(ym.slice(5))}월`;

function budgetPanelHtml() {
  const B = state.data.budgets || {};
  const months = Object.keys(B).filter((k) => /^\d{4}-\d{2}$/.test(k));
  if (setm.bMonth !== 'default' && !months.includes(setm.bMonth)) months.push(setm.bMonth); // 새로 추가 중인 달
  months.sort();
  const isDefault = setm.bMonth === 'default';
  const mid = setm.bScope;
  // 지금 칸에 저장된 값 (이 달·이 대상에 직접 정한 값만)
  const own = (() => {
    const o = B[setm.bMonth] || {};
    return mid ? ((o.byMember || {})[mid] || {}) : o;
  })();
  // 비어 있을 때 보여 줄 기본값 (특정 달일 때만)
  const fallback = (cid) => {
    if (isDefault) return null;
    const d = B.default || {};
    const s = mid ? ((d.byMember || {})[mid] || {}) : d;
    const v = cid ? (s.byCategory || {})[cid] : s.total;
    return typeof v === 'number' && v > 0 ? v : null;
  };
  const input = (cid, value) => {
    const fb = fallback(cid);
    const ph = fb != null ? `기본값 ${fmt(fb)}` : '없음';
    const v = typeof value === 'number' && value > 0 ? fmtNum(value) : '';
    return `<span class="amount-wrap"><input type="text" class="b-input num" data-cat="${escapeHtml(cid)}" inputmode="numeric" autocomplete="off" placeholder="${ph}" value="${v}" data-last="${v}"><span class="amount-unit">원</span></span>`;
  };
  const scopeChips = [{ id: '', name: '가족 전체', color: 'gray' }, ...state.data.members.filter((m) => !m.hidden || m.id === mid)]
    .map((m) => `<button type="button" class="member-chip${m.id === mid ? ' selected' : ''}" data-action="b-scope" data-id="${escapeHtml(m.id)}" ` +
      `style="background:var(--c-${m.color || 'gray'}-bg);color:var(--c-${m.color || 'gray'}-text)${m.id === mid ? `;border-color:var(--c-${m.color || 'gray'}-text)` : ''}">${escapeHtml(m.name)}</button>`).join('');
  const cats = state.data.categories.filter((c) => c.type === 'expense' && (!c.hidden || (own.byCategory || {})[c.id]));
  return `<div class="field"><span class="field-label">기간</span><div class="b-controls">` +
    `<select id="bMonth"><option value="default"${isDefault ? ' selected' : ''}>기본값 (매달)</option>` +
    months.map((k) => `<option value="${k}"${k === setm.bMonth ? ' selected' : ''}>${monthLabel(k)}만 따로</option>`).join('') + `</select>` +
    `<input type="month" id="bNewMonth" value="${monthKey(state.year, state.month)}" aria-label="따로 정할 달">` +
    `<button type="button" class="text-btn" data-action="b-add-month">이 달만 따로 정하기</button></div>` +
    (isDefault ? '<span class="hint">따로 정한 달이 없으면 매달 이 예산을 씁니다.</span>'
      : '<span class="hint">비워 둔 칸은 기본값을 따릅니다.</span>') + `</div>` +
    `<div class="field"><span class="field-label">대상</span><div class="member-pick">${scopeChips}</div></div>` +
    `<div class="b-grid"><strong>월 전체 예산</strong>${input('', own.total)}</div>` +
    `<div class="field"><span class="field-label">분류별 예산 (지출)</span><div class="b-grid">` +
    cats.map((c) => `<span>${escapeHtml(c.emoji || '')} ${escapeHtml(c.name)}</span>${input(c.id, (own.byCategory || {})[c.id])}`).join('') +
    `</div></div><p class="form-error" id="seError"></p>` +
    `<div class="editor-btns">${isDefault ? '' : '<button type="button" class="danger-btn" data-action="b-del-month">이 달 따로 정한 예산 지우기</button>'}` +
    `<div class="spacer"></div><button type="button" class="primary-btn" data-action="b-save">예산 저장</button></div>`;
}

// 입력한 예산 저장: 빈 칸은 지움(기본값 따름 / 예산 없음)
function saveBudget() {
  const ym = setm.bMonth, mid = setm.bScope;
  const vals = {};
  document.querySelectorAll('.b-input').forEach((el) => { vals[el.dataset.cat] = Number(el.value.replace(/,/g, '')) || 0; });
  commit((d) => {
    d.budgets = d.budgets || {};
    const month = d.budgets[ym] || (d.budgets[ym] = {});
    let target = month;
    if (mid) { month.byMember = month.byMember || {}; target = month.byMember[mid] || (month.byMember[mid] = {}); }
    if (vals['']) target.total = vals['']; else delete target.total;
    target.byCategory = target.byCategory || {};
    for (const [cid, v] of Object.entries(vals)) {
      if (!cid) continue;
      if (v) target.byCategory[cid] = v; else delete target.byCategory[cid];
    }
    // 빈 묶음 정리
    if (!Object.keys(target.byCategory).length) delete target.byCategory;
    if (mid && !Object.keys(target).length) delete month.byMember[mid];
    if (month.byMember && !Object.keys(month.byMember).length) delete month.byMember;
    if (ym !== 'default' && !Object.keys(month).length) delete d.budgets[ym];
  });
  toast(`${ym === 'default' ? '기본' : monthLabel(ym)} ${mid ? memberById(mid).name + ' ' : ''}예산을 저장했습니다.`);
}

$('#setBody').addEventListener('click', (e) => {
  const b = e.target.closest('[data-action]');
  if (!b || setm.tab !== 'budget') return;
  const act = b.dataset.action;
  if (act === 'b-scope') { setm.bScope = b.dataset.id; renderSettings(); }
  else if (act === 'b-add-month') {
    const v = $('#bNewMonth').value;
    if (!v) { $('#seError').textContent = '달을 골라 주세요.'; return; }
    setm.bMonth = v; renderSettings();
  } else if (act === 'b-save') saveBudget();
  else if (act === 'b-del-month') {
    const ym = setm.bMonth;
    if (!confirm(`${monthLabel(ym)}에 따로 정한 예산을 지울까요? (기본값을 쓰게 됩니다)`)) return;
    setm.bMonth = 'default';
    commit((d) => { if (d.budgets) delete d.budgets[ym]; });
  }
});
$('#setBody').addEventListener('change', (e) => { if (e.target.id === 'bMonth') { setm.bMonth = e.target.value; renderSettings(); } });

$('#setBody').addEventListener('input', (e) => { if (e.target.id === 'seOpening' || e.target.classList.contains('b-input')) formatAmountInput(e); });
$('#setBody').addEventListener('change', (e) => {
  if (e.target.id !== 'seKind') return;
  const card = e.target.value === 'card';
  $('#seCard').hidden = !card;
  $('#seOpeningLabel').textContent = card ? '처음 미결제 금액' : '시작 잔액';
  $('#seOpeningHint').hidden = !card;
});
document.querySelectorAll('.set-tab').forEach((b) => b.addEventListener('click', () => {
  setm.tab = b.dataset.set; setm.editing = false; setm.id = null; renderSettings();
}));
$('#setClose').addEventListener('click', closeSettings);
$('#settingsBtn').addEventListener('click', openSettings);

// ---------- 앱 창 (15장): 10초마다 /api/ping, 창을 닫으면 /api/bye, 창 위치·크기 기억 ----------
const CLIENT_ID = makeId();
let lastWin = '';
async function appPing() {
  try {
    const r = await fetch(`/api/ping?client=${CLIENT_ID}`, { cache: 'no-store' });
    const j = await r.json();
    if (!j.appMode) return;
    // 앱 창이면 위치·크기가 바뀌었을 때만 저장
    const w = { x: window.screenX, y: window.screenY, width: window.outerWidth, height: window.outerHeight };
    const key = JSON.stringify(w);
    if (key !== lastWin && w.width >= 400 && w.height >= 300) {
      lastWin = key;
      fetch('/api/window', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: key });
    }
  } catch { /* 서버가 잠깐 안 보이면 다음에 */ }
}
appPing();
setInterval(appPing, 10000);
window.addEventListener('pagehide', () => { try { navigator.sendBeacon('/api/bye', CLIENT_ID); } catch {} });

// ---------- 상단바 동작 ----------
function moveMonth(delta) {
  const d = new Date(state.year, state.month - 1 + delta, 1);
  state.year = d.getFullYear();
  state.month = d.getMonth() + 1;
  renderAll();
}

document.querySelectorAll('.tab').forEach((b) =>
  b.addEventListener('click', () => {
    // 다른 탭으로 옮기면 날짜 선택이 풀리고 사이드바는 계좌·카드로
    if (state.tab !== b.dataset.tab) clearSelectedDate();
    state.tab = b.dataset.tab;
    renderAll();
  }));
$('#prevMonth').addEventListener('click', () => moveMonth(-1));
$('#nextMonth').addEventListener('click', () => moveMonth(1));
$('#thisMonth').addEventListener('click', () => {
  state.year = today.getFullYear();
  state.month = today.getMonth() + 1;
  renderAll();
});

renderAll();
loadFromServer();

</script>

// 앱 파일을 휴대폰에 저장 (설치형 웹앱)
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
